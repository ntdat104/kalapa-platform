# Namespace được tạo theo kiểu khai báo thay vì bằng `--create-namespace`, để
# nhãn của chúng do Git sở hữu. Có hai họ nhãn đáng quan tâm:
#
#   pod-security.kubernetes.io/*  -> Pod Security Admission. `restricted` là
#       profile nghiêm nhất có sẵn: không leo thang quyền, không chạy root, bỏ
#       hết capability, bắt buộc có seccomp. securityContext của chart go-service
#       được viết để thoả nó, nên chính nhãn này là bằng chứng các thiết lập kia
#       là thật chứ không phải trang trí.
#   kubernetes.io/metadata.name   -> do API server tự gán; các namespaceSelector
#       của NetworkPolicy bám vào nó.
#
# Dùng `warn` và `audit` mà không có `enforce` thì chỉ ghi log vi phạm. Ở đây
# `enforce` được dùng ở mọi nơi có thể, và được nới lỏng có chủ ý ở những chỗ mà
# một thành phần thực sự cần nhiều quyền hơn (observability chạy một bộ thu thập
# log ở mức node; các operator dữ liệu chạy init container đặc quyền).
---
apiVersion: v1
kind: Namespace
metadata:
  name: kalapa
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: data
  labels:
    # Các pod instance của CloudNativePG cần vài thứ mà `restricted` cấm.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: identity
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    # node-exporter mount filesystem của host và dùng chung network của host;
    # cả hai đều không được phép dưới mức baseline.
    pod-security.kubernetes.io/enforce: privileged
