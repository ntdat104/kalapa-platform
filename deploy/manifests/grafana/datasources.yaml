# Các datasource của Grafana, được nạp qua sidecar vốn theo dõi những ConfigMap
# mang nhãn grafana_datasource: "1".
#
# Phần đáng giá nằm ở các liên kết chéo. Ba tín hiệu chỉ trở nên hữu dụng như
# một hệ thống khi bạn đi được từ cái này sang cái kia:
#
#   đỉnh metric  --(exemplar)-->      trace
#   span trace   --(tracesToLogs)-->  log của đúng pod đó tại đúng thời điểm đó
#   dòng log     --(derivedField)-->  trace mà nó thuộc về
#
# Mỗi liên kết là một khối bên dưới. Bỏ chúng đi thì bạn chỉ có ba công cụ rời
# rạc tình cờ được cài chung một cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kalapa-datasources
  namespace: observability
  labels:
    grafana_datasource: "1"
data:
  kalapa-datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki-gateway.observability
        jsonData:
          maxLines: 1000
          derivedFields:
            # Quét từng dòng log tìm trường trace_id rồi hiển thị nó thành một
            # link bấm được sang Tempo. Log của ta là JSON nên biểu thức chính quy
            # nhắm vào giá trị JSON đã bọc nháy.
            - name: TraceID
              datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              url: '$${__value.raw}'
              urlDisplayLabel: 'View trace'

      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        # 3200, không phải 3100. API truy vấn HTTP của Tempo và cổng 3100 (vốn
        # là của Loki) rất dễ bị nhầm lẫn; triệu chứng là một datasource Tempo lưu
        # được bình thường nhưng mọi lần tìm đều trả về "no data". Kiểm tra bằng:
        #   kubectl -n observability get svc tempo -o json | jq '.spec.ports'
        url: http://tempo.observability:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            # Thu hẹp truy vấn log về đúng pod đó và một cửa sổ thời gian quanh
            # span, nếu không cú bấm sẽ ném bạn vào log của cả cluster.
            spanStartTimeShift: '-5m'
            spanEndTimeShift: '5m'
            filterByTraceID: true
            filterBySpanID: false
            tags:
              - key: 'k8s.namespace.name'
                value: 'namespace'
              - key: 'k8s.pod.name'
                value: 'pod'
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: '-5m'
            spanEndTimeShift: '5m'
            queries:
              - name: 'Request rate'
                query: 'sum(rate(http_server_requests_total{$$__tags}[5m]))'
          serviceMap:
            # Đọc các metric suy ra từ span mà generator của Tempo remote-write
            # sang Prometheus. Trỏ nhầm datasource thì service map hiện ra trống
            # trơn mà không có lỗi nào.
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          search:
            hide: false
          lokiSearch:
            datasourceUid: loki
          traceQuery:
            timeShiftEnabled: true
