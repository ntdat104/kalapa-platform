# The "app of apps" root. This is the single object you apply by hand; it
# pulls in everything else, and from then on the cluster's desired state is
# whatever is in Git.
#
# It syncs the two directories of Application manifests. Argo CD creates those
# Applications, each of which then syncs its own source. The root app's job is
# ordering and nothing else.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  # Without this finalizer, deleting the root Application orphans every child:
  # the Applications vanish from Argo CD while their workloads keep running.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: __GIT_REPO_URL__
    targetRevision: __GIT_BRANCH__
    path: deploy/argocd
    directory:
      recurse: true
      # Only the Application/AppProject manifests, not the charts next to them.
      include: '{projects/*.yaml,platform/*.yaml,apps/*.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # prune: delete objects removed from Git. Off, and Git stops being the
      # source of truth the moment you delete a file.
      prune: true
      # selfHeal: revert manual `kubectl edit`. This is the setting that makes
      # the cluster actually converge; expect it to undo your debugging edits.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
