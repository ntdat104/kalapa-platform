# Gốc của mô hình "app of apps". Đây là object DUY NHẤT bạn apply bằng tay; nó
# kéo theo mọi thứ còn lại, và từ đó trở đi trạng thái mong muốn của cluster
# chính là thứ nằm trong Git.
#
# Nó đồng bộ các thư mục chứa Application manifest. Argo CD tạo ra những
# Application đó, rồi mỗi cái tự đồng bộ nguồn của riêng nó. Việc của root app
# chỉ là sắp thứ tự, không gì khác.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  # Thiếu finalizer này, xoá root Application sẽ bỏ rơi mọi Application con:
  # chúng biến mất khỏi Argo CD trong khi workload vẫn tiếp tục chạy.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: __GIT_REPO_URL__
    targetRevision: __GIT_BRANCH__
    path: deploy/argocd
    directory:
      recurse: true
      # Chỉ lấy manifest Application/AppProject, không lấy các chart nằm cạnh.
      include: '{projects/*.yaml,platform/*.yaml,apps/*.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # prune: xoá khỏi cluster những object đã bị xoá khỏi Git. Tắt nó đi là
      # Git thôi làm nguồn sự thật ngay khoảnh khắc bạn xoá một file.
      prune: true
      # selfHeal: hoàn nguyên những lần `kubectl edit` chạy tay. Đây là thiết
      # lập làm cho cluster thực sự hội tụ; hãy chuẩn bị tinh thần nó sẽ xoá cả
      # những chỉnh sửa bạn đang dùng để gỡ lỗi.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
