# Argo CD, trimmed for a 7 GB single-node cluster.
#
# Component map — worth knowing before you tune any of it:
#   application-controller  reconciles live state against desired state; the
#                           memory hog, because it caches every object it
#                           manages
#   repo-server             clones Git and runs `helm template` / `kustomize
#                           build`; CPU-bound, and where chart rendering fails
#   server                  the API and web UI
#   applicationset-controller  expands ApplicationSets into Applications
#   redis                   cache for the controller's manifest renders
#   dex                     SSO broker — disabled here, local admin only
#   notifications           Slack/webhook on sync events — disabled
#
# Installed with Helm rather than by Argo CD itself. Self-managing Argo CD is
# possible and elegant, but means a broken sync can leave you with no way to
# fix the broken sync.

global:
  domain: argocd.kalapa.local

configs:
  params:
    # Plain HTTP behind the NGINX Ingress. With TLS on, Argo CD redirects to
    # HTTPS, the Ingress forwards HTTP, and you get a redirect loop — the
    # single most common Argo-behind-ingress problem.
    server.insecure: true
    # One worker per kind instead of the default. Fewer goroutines, slower
    # reconciles, much less memory.
    controller.status.processors: "2"
    controller.operation.processors: "2"
    # Keep the repo-server from holding several rendered charts in memory.
    reposerver.parallelism.limit: "2"

  cm:
    # How long before Argo re-reads Git when no webhook has fired. The default
    # is 3m; 2m keeps the lab responsive without hammering GitHub.
    timeout.reconciliation: 120s
    # Treat these as "not drift": they are written by controllers, not by Git.
    resource.customizations.ignoreDifferences.all: |
      jsonPointers:
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration

  # Only one admin account. Adding users here is the alternative to running Dex.
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, admin, role:admin

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      # Rendering kube-prometheus-stack (a few thousand manifests) is the peak.
      # Below ~384Mi the repo-server is OOMKilled mid-render and the
      # Application reports a confusing "rpc error: code = Unavailable".
      memory: 384Mi

server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 192Mi
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.kalapa.local

applicationSet:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

redis:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

dex:
  # ~60Mi for an SSO broker with no identity provider behind it.
  enabled: false

notifications:
  enabled: false
