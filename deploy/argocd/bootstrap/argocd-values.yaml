# Argo CD, đã cắt gọt cho một cluster một node.
#
# Bản đồ thành phần — nên biết trước khi chỉnh bất cứ thứ gì:
#   application-controller  điều hoà trạng thái thật theo trạng thái mong muốn;
#                           đây là thành phần ngốn bộ nhớ nhất vì nó cache mọi
#                           object nó quản
#   repo-server             clone Git và chạy `helm template` / `kustomize
#                           build`; nặng CPU, và là nơi việc render chart hỏng
#   server                  API và giao diện web
#   applicationset-controller  bung ApplicationSet thành các Application
#   redis                   cache cho kết quả render manifest của controller
#   dex                     bộ môi giới SSO — tắt ở đây, chỉ dùng admin cục bộ
#   notifications           gửi Slack/webhook khi đồng bộ — tắt
#
# Cài bằng Helm chứ không để Argo CD tự quản lấy mình. Để Argo CD tự quản là
# khả thi và đẹp, nhưng khi đó một lần đồng bộ hỏng có thể khiến bạn không còn
# cách nào sửa chính lần đồng bộ hỏng đó.

global:
  domain: argocd.kalapa.local

configs:
  params:
    # Chạy HTTP thuần sau NGINX Ingress. Bật TLS thì Argo CD chuyển hướng sang
    # HTTPS, Ingress lại chuyển tiếp HTTP, và bạn có một vòng lặp chuyển hướng —
    # đây là sự cố phổ biến nhất khi đặt Argo CD sau ingress.
    server.insecure: true
    # Mỗi loại tài nguyên một worker thay vì mặc định. Ít goroutine hơn, điều
    # hoà chậm hơn, nhưng tốn ít bộ nhớ hơn hẳn.
    controller.status.processors: "2"
    controller.operation.processors: "2"
    # Giữ cho repo-server không ôm nhiều chart đã render cùng lúc trong bộ nhớ.
    reposerver.parallelism.limit: "2"

  cm:
    # Bao lâu thì Argo đọc lại Git khi không có webhook nào kích hoạt. Mặc định
    # là 3 phút; để 2 phút cho lab phản hồi nhanh mà không dội quá nhiều vào GitHub.
    timeout.reconciliation: 120s
    # Coi những trường này là "không phải drift": chúng do controller ghi, không
    # phải từ Git.
    resource.customizations.ignoreDifferences.all: |
      jsonPointers:
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration

  # Chỉ một tài khoản admin. Thêm người dùng ở đây là cách thay cho việc chạy Dex.
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, admin, role:admin

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      # Render kube-prometheus-stack (vài nghìn manifest) là lúc đỉnh điểm. Dưới
      # khoảng 384Mi thì repo-server bị OOMKill giữa chừng và Application báo một
      # lỗi rất khó hiểu: "rpc error: code = Unavailable".
      memory: 384Mi

server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 192Mi
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.kalapa.local

applicationSet:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

redis:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

dex:
  # Khoảng 60Mi cho một bộ môi giới SSO mà phía sau chẳng có nhà cung cấp định
  # danh nào.
  enabled: false

notifications:
  enabled: false
