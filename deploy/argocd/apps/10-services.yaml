# ApplicationSet sinh ra các Application từ một khuôn mẫu. Ba manifest
# Application gần như giống hệt nhau thì hôm nay cũng chạy tốt; lý do dùng bộ
# sinh là để thêm service thứ tư chỉ còn là "tạo một thư mục chart" thay vì "tạo
# một thư mục chart rồi nhớ viết thêm một Application và đặt đúng project, sync
# policy và sync wave cho nó".
#
# Bộ sinh kiểu git directory quét repo ngay lúc đồng bộ, nên tập Application
# được suy ra từ nội dung thật của repo chứ không từ một danh sách mà ai đó phải
# nhớ cập nhật theo.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kalapa-services
  namespace: argocd
spec:
  # Thiếu dòng này, xoá ApplicationSet sẽ để lại các Application con mồ côi.
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - git:
        repoURL: __GIT_REPO_URL__
        revision: __GIT_BRANCH__
        directories:
          - path: deploy/charts/*
          # Chart gốc là một dependency, không phải thứ để deploy; còn chart cấu
          # hình và chart hạ tầng đã có Application riêng với project và sync wave
          # khác.
          - path: deploy/charts/go-service
            exclude: true
          - path: deploy/charts/kalapa-config
            exclude: true
          - path: deploy/charts/postgres
            exclude: true
          - path: deploy/charts/kafka
            exclude: true
          - path: deploy/charts/keycloak
            exclude: true
  template:
    metadata:
      # path.basename chính là tên thư mục: gateway, kyc, scoring.
      name: '{{path.basename}}'
      annotations:
        argocd.argoproj.io/sync-wave: "30"
    spec:
      project: kalapa
      source:
        repoURL: __GIT_REPO_URL__
        targetRevision: __GIT_BRANCH__
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: kalapa
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff: { duration: 15s, factor: 2, maxDuration: 3m }
