apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kalapa-config
  namespace: argocd
  annotations:
    # Đi trước các service: một pod có ConfigMap chưa tồn tại sẽ kẹt ở
    # ContainerCreating vô hạn chứ không hỏng kèm một lỗi rõ ràng.
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: kalapa
  source:
    repoURL: __GIT_REPO_URL__
    targetRevision: __GIT_BRANCH__
    path: deploy/charts/kalapa-config
  destination:
    server: https://kubernetes.default.svc
    namespace: kalapa
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
