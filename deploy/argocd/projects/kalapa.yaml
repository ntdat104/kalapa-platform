apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kalapa
  namespace: argocd
spec:
  description: The Kalapa Go services
  sourceRepos:
    # Chỉ một repo duy nhất. Một Application trong project này không thể bị trỏ
    # tới một chart do kẻ tấn công kiểm soát.
    - __GIT_REPO_URL__
  destinations:
    - namespace: kalapa
      server: https://kubernetes.default.svc
  # Danh sách rỗng = không cho phép bất kỳ tài nguyên phạm vi cluster nào. Một
  # chart service mọc thêm ClusterRole sẽ bị TỪ CHỐI thay vì được âm thầm cấp.
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: monitoring.coreos.com
      kind: ServiceMonitor
