# AppProject là ranh giới phân quyền của Argo CD. Không có nó, mọi Application
# chạy dưới `default`, vốn cho phép mọi repo nguồn, mọi cluster đích và mọi loại
# tài nguyên — tức là một Git repo bị chiếm quyền sẽ tương đương cluster-admin.
#
# Hai project ở đây vạch ra ranh giới thực sự quan trọng: thành phần nền tảng
# được tạo object phạm vi cluster (CRD, ClusterRole); project của ứng dụng thì
# không.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Operators, data stores and the observability stack
  sourceRepos:
    - __GIT_REPO_URL__
    # Các Application nền tảng render chart từ bên ngoài, nên repo của chúng
    # cũng phải nằm trong danh sách cho phép.
    - https://cloudnative-pg.github.io/charts
    - https://strimzi.io/charts/
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://stakater.github.io/stakater-charts
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
