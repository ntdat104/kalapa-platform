apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
  annotations:
    # Sync wave quyết định thứ tự Argo apply các tài nguyên. Root app tạo mọi
    # object Application này cùng lúc; annotation wave trên từng cái quyết định
    # thứ tự Argo bắt đầu đồng bộ chúng. Số nhỏ chạy trước, và Argo chờ một wave
    # đạt Healthy rồi mới sang wave kế.
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: platform
  source:
    repoURL: __GIT_REPO_URL__
    targetRevision: __GIT_BRANCH__
    path: deploy/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: { prune: false, selfHeal: true }
