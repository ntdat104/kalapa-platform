# Grafana Alloy thu thập log của container và chuyển chúng vào Loki.
#
# YAS dùng Promtail cho việc này. Promtail đã ngừng hỗ trợ từ đầu năm 2025 và
# Alloy là bản thay thế; mô hình tư duy y hệt (đọc file dưới /var/log/pods, gắn
# nhãn, đẩy vào Loki) nhưng ngôn ngữ cấu hình là River chứ không phải YAML. Bảng
# đối chiếu nằm ở docs/01-yas-mapping.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-logs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.13.0
    helm:
      releaseName: alloy-logs
      values: |
        controller:
          # DaemonSet: file log nằm trên node, nên bộ thu thập cũng phải nằm đó.
          type: daemonset

        alloy:
          mounts:
            # /var/log/pods là nơi kubelet dựng cây thư mục log theo từng container.
            varlog: true
            # ...nhưng dưới container runtime là DOCKER thì các file đó chỉ là
            # SYMLINK trỏ vào /var/lib/docker/containers. Chỉ mount /var/log thôi
            # thì mọi lần đọc file đều hỏng với "no such file or directory",
            # trong khi mọi component của Alloy vẫn báo healthy — log đơn giản là
            # không bao giờ tới nơi, và không log nào nói cho bạn biết vì sao.
            #
            # Dưới containerd (mặc định ở hầu hết cluster thật, và là thứ
            # `minikube start --container-runtime=containerd` cho bạn), các file
            # dưới /var/log/pods là file thật và mount này không cần thiết. Ở đó
            # nó vô hại, nên cứ để bật để cả hai runtime đều chạy được.
            dockercontainers: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi

          configMap:
            content: |-
              // ---------------------------------------------------------------
              // 1. Phát hiện mọi pod trên CHÍNH node này.
              //    Thiếu bộ lọc theo node, mỗi pod của DaemonSet sẽ phát hiện ra
              //    mọi pod trong cả cluster rồi không tìm thấy file log cục bộ
              //    của phần lớn trong số đó.
              // ---------------------------------------------------------------
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
                }
              }

              // ---------------------------------------------------------------
              // 2. Biến metadata của pod thành label của Loki.
              //
              //    Chọn label CHÍNH LÀ quyết định về chi phí trong Loki. Mỗi tổ
              //    hợp giá trị label khác nhau là một stream riêng, với mục index
              //    và chunk riêng. namespace/pod/container bị chặn trên bởi quy
              //    mô cluster. Nâng trace_id hay request_id lên thành label ở đây
              //    sẽ tạo một stream cho mỗi request và phá nát index — đó là lý
              //    do chúng nằm trong thân dòng log và được tìm bằng biểu thức
              //    lọc thay vì tra index.
              // ---------------------------------------------------------------
              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app"
                }
                // Dựng đường dẫn trên đĩa mà Alloy sẽ đọc.
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  action        = "replace"
                  replacement   = "/var/log/pods/*$1/*.log"
                  target_label  = "__path__"
                }
              }

              // ---------------------------------------------------------------
              // 3. Khai triển glob thành các đường dẫn cụ thể.
              //
              //    Component này rất dễ bị bỏ quên và kiểu hỏng thì gây hoang
              //    mang: `loki.source.file` nhận đường dẫn CỤ THỂ và không tự
              //    khai triển glob, nên trỏ thẳng nó vào kết quả relabel sẽ sinh
              //    ra một lỗi stat cho mỗi container —
              //
              //      failed to tail file, stat failed:
              //      stat /var/log/pods/*<uid>/<container>/*.log
              //
              //    — và không một dòng log nào tới được Loki. `local.file_match`
              //    mới là component phân giải mẫu đường dẫn và tiếp tục theo dõi
              //    những file xuất hiện sau, nhờ đó một pod mới được xếp lịch sẽ
              //    được nhặt lên mà không cần restart.
              // ---------------------------------------------------------------
              local.file_match "pod_logs" {
                path_targets = discovery.relabel.pod_logs.output
                sync_period  = "10s"
              }

              // 4. Đọc các file đó.
              loki.source.file "pod_logs" {
                targets    = local.file_match.pod_logs.targets
                forward_to = [loki.process.parse.receiver]
              }

              // ---------------------------------------------------------------
              // 5. Phân tích. Stage CRI bóc lớp bọc của container runtime
              //    ("<thời gian> stdout F <dòng log>"); bỏ qua nó thì mọi dòng
              //    log đều bị dính tiền tố nhiễu và stage JSON sẽ hỏng.
              // ---------------------------------------------------------------
              loki.process "parse" {
                // Hai runtime, hai định dạng dòng trên đĩa, và một stage không
                // phân tích nổi một dòng thì để nguyên dòng đó chứ không báo lỗi
                // — nên liệt kê cả hai làm pipeline chạy được với mọi runtime.
                //
                //   containerd:  2026-10-07T11:40:50Z stdout F {"level":"info"...}
                //   docker:      {"log":"{\"level\":\"info\"...}","stream":"stdout",...}
                //
                // Sai chỗ này thì log vẫn tới nơi, nhưng mọi dòng đều là lớp bọc
                // thô của runtime, `stage.json` bên dưới không tìm thấy trường
                // `level`, và hai label level/service âm thầm không bao giờ xuất hiện.
                stage.cri {}
                stage.docker {}

                // Rút `level` ra khỏi log JSON của ta để biến nó thành một label.
                stage.json {
                  expressions = {
                    level   = "level",
                    service = "service",
                  }
                }

                // Chỉ nâng `level` và `service` lên thành label. trace_id vẫn
                // nằm trong thân dòng log — xem ghi chú về cardinality ở trên.
                stage.labels {
                  values = {
                    level   = "",
                    service = "",
                  }
                }

                forward_to = [loki.write.default.receiver]
              }

              // 6. Đẩy vào Loki.
              loki.write "default" {
                endpoint {
                  url = "http://loki-gateway.observability/loki/api/v1/push"
                }
              }

        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
