apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    # Wave 10: sau khi operator CNPG (wave -10) đã cài xong CRD Cluster.
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  source:
    repoURL: __GIT_REPO_URL__
    targetRevision: __GIT_BRANCH__
    path: deploy/charts/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
    retry:
      # Operator cần một lúc mới tạo xong các pod của Cluster; không có retry
      # thì lần đồng bộ đầu bị đánh dấu Degraded rồi nằm nguyên như vậy.
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
  ignoreDifferences:
    # Operator ghi ngược status và một vài trường spec được điền mặc định lên
    # chính Cluster. Argo sẽ đọc chúng thành drift và đánh nhau với operator ở
    # mỗi lần điều hoà.
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /spec/bootstrap/initdb/postInitApplicationSQL
