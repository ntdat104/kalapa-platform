# OpenTelemetry Collector là đường nối duy nhất giữa "thứ ứng dụng phát ra" và
# "nơi telemetry được lưu".
#
# Vì sao không để mỗi service đẩy thẳng vào Tempo? Vì khi đó mỗi lần đổi nơi lưu
# là một lần deploy lại toàn bộ service. Có collector thì ứng dụng chỉ nói một
# giao thức (OTLP) tới một địa chỉ, mãi mãi; còn định tuyến, lấy mẫu, lọc và
# chỉnh thuộc tính đều trở thành một thay đổi cấu hình ở đây.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-collector
  namespace: argocd
  annotations:
    # Sau Tempo và Prometheus: các exporter của collector sẽ lỗi (và pod ghi đầy
    # log lỗi) cho tới khi nơi nhận tồn tại.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.175.1
    helm:
      releaseName: opentelemetry-collector
      values: |
        # `deployment` = một instance dùng chung. Các lựa chọn khác:
        #   daemonset   -> mỗi node một bản, cho telemetry cục bộ của node
        #   statefulset -> khi cần định tuyến dính (tail sampling)
        # Kiểu gateway deployment là hình dạng đúng cho OTLP do ứng dụng đẩy lên.
        mode: deployment
        replicaCount: 1

        image:
          # Bản phân phối `-contrib` mang theo những exporter mà bản lõi không
          # có — trong đó có prometheusremotewrite. Giá trị mặc định
          # `otelcol-contrib` của chart vốn đã đúng, nhưng ghim lại để một thay
          # đổi mặc định của chart không âm thầm làm mất một exporter.
          repository: otel/opentelemetry-collector-contrib

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi

        # Các preset của chart tự viết giúp bạn một phần cấu hình. Tắt hết ở đây
        # để pipeline bên dưới là toàn bộ sự thật, không có gì bị thêm vào mà bạn
        # không nhìn thấy.
        presets:
          logsCollection:
            enabled: false
          kubernetesAttributes:
            enabled: false

        # RBAC cho processor k8sattributes, vốn cần đọc pod để biến một IP pod
        # thành k8s.pod.name / k8s.namespace.name.
        clusterRole:
          create: true
          rules:
            - apiGroups: [""]
              resources: ["pods", "namespaces", "nodes"]
              verbs: ["get", "watch", "list"]
            - apiGroups: ["apps"]
              resources: ["replicasets"]
              verbs: ["get", "watch", "list"]

        ports:
          otlp:
            enabled: true
            containerPort: 4317
            servicePort: 4317
            protocol: TCP
          otlp-http:
            enabled: true
            containerPort: 4318
            servicePort: 4318
            protocol: TCP
          metrics:
            enabled: true

        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318

          processors:
            # memory_limiter PHẢI đứng đầu mọi pipeline. Nó xả bớt tải khi
            # collector tiến gần giới hạn của chính nó; đặt nó ở sau thì các
            # processor phía trước đã cấp phát xong đúng phần bộ nhớ gây ra OOM.
            memory_limiter:
              check_interval: 1s
              limit_percentage: 80
              spike_limit_percentage: 25

            # Làm giàu span bằng metadata của pod, khớp theo IP nguồn.
            k8sattributes:
              auth_type: serviceAccount
              passthrough: false
              extract:
                metadata:
                  - k8s.namespace.name
                  - k8s.pod.name
                  - k8s.deployment.name
                  - k8s.node.name
              pod_association:
                - sources:
                    - from: resource_attribute
                      name: k8s.pod.name
                - sources:
                    - from: connection

            # batch đứng cuối: gom lô trước khi làm giàu sẽ buộc phải duyệt lại
            # từng lô để làm giàu.
            batch:
              timeout: 5s
              send_batch_size: 1024
              send_batch_max_size: 2048

          exporters:
            otlp/tempo:
              endpoint: tempo.observability:4317
              tls:
                insecure: true
              sending_queue:
                enabled: true
                # Có giới hạn: một hàng đợi vô hạn sẽ biến một sự cố của Tempo
                # thành một lần OOM của collector.
                queue_size: 1000
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_interval: 30s
                max_elapsed_time: 120s

            prometheusremotewrite:
              endpoint: http://prometheus-kube-prometheus-prometheus.observability:9090/api/v1/write
              resource_to_telemetry_conversion:
                # Chép các thuộc tính tài nguyên (service.name, k8s.pod.name)
                # sang thành label của metric. Thiếu nó thì mọi metric không quy
                # được về đâu cả.
                enabled: true

            debug:
              # `detailed` đổ mọi span ra stdout. Hữu ích trong mười phút khi
              # bạn gỡ lỗi pipeline, nhưng tai hại nếu để thường trực.
              verbosity: basic

          service:
            telemetry:
              metrics:
                # Metric nội bộ của chính collector. Được ServiceMonitor bên
                # dưới scrape — một collector đang âm thầm vứt dữ liệu trông y
                # hệt một collector không có traffic, trừ khi bạn theo dõi mấy
                # con số này.
                level: normal
            pipelines:
              traces:
                receivers: [otlp]
                processors: [memory_limiter, k8sattributes, batch]
                exporters: [otlp/tempo]
              metrics:
                receivers: [otlp]
                processors: [memory_limiter, k8sattributes, batch]
                exporters: [prometheusremotewrite]
              logs:
                # Hiện chưa có gì đẩy log qua OTLP — các service Go ghi JSON ra
                # stdout và Alloy chuyển đi. Pipeline này tồn tại để sau này
                # chuyển sang đường log OTLP chỉ là một thay đổi cấu hình ở đây
                # chứ không phải thêm một thành phần mới.
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [debug]

        serviceMonitor:
          enabled: true
          extraLabels:
            release: prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
