apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: platform
  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: 2.2.18
    helm:
      values: |
        fullnameOverride: kalapa-reloader
        reloader:
          # Giới hạn trong namespace: một Reloader phạm vi toàn cluster cần RBAC
          # toàn cluster và sẽ restart cả những workload mà lab này không sở hữu.
          watchGlobally: false
          deployment:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            # Namespace `kalapa` thực thi Pod Security Standard mức `restricted`,
            # mà giá trị mặc định của chart này không thoả. Thiếu hai khối dưới
            # đây thì Deployment vẫn được tạo, mọi Pod bị từ chối ngay ở
            # admission, và manh mối duy nhất là một event FailedCreate trên
            # ReplicaSet:
            #
            #   kubectl -n kalapa describe rs -l app=kalapa-reloader
            #
            # Đây là thứ `enforce: restricted` mang lại — và cũng là cái giá của
            # nó: mọi chart bên thứ ba bạn cài đều phải tự chứng minh mình xứng
            # đáng được vào.
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              seccompProfile:
                type: RuntimeDefault
            containerSecurityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
  destination:
    server: https://kubernetes.default.svc
    namespace: kalapa
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
