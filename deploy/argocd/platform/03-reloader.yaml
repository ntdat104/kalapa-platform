apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: platform
  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: 2.2.18
    helm:
      values: |
        fullnameOverride: kalapa-reloader
        reloader:
          # Namespace-scoped: a cluster-wide Reloader needs cluster-wide RBAC
          # and would restart workloads this lab does not own.
          watchGlobally: false
          deployment:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            # The `kalapa` namespace enforces the `restricted` Pod Security
            # Standard, and the chart's defaults do not satisfy it. Without
            # these two blocks the Deployment is created, every Pod is refused
            # at admission, and the only clue is a FailedCreate event on the
            # ReplicaSet:
            #
            #   kubectl -n kalapa describe rs -l app=kalapa-reloader
            #
            # This is what `enforce: restricted` buys you — and what it costs:
            # every third-party chart you install has to earn its place.
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              seccompProfile:
                type: RuntimeDefault
            containerSecurityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
  destination:
    server: https://kubernetes.default.svc
    namespace: kalapa
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
