apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    # Operator đi trước các custom resource mà nó điều hoà: apply một `Cluster`
    # khi CRD của nó chưa tồn tại sẽ hỏng với lỗi "no matches for kind".
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: platform
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1
    helm:
      values: |
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            memory: 192Mi
        monitoring:
          podMonitorEnabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      # CRD đủ lớn để vượt giới hạn 256 KB của annotation mà chế độ apply phía
      # client mặc định của Argo dùng để lưu trạng thái đã apply lần trước.
      - ServerSideApply=true
