# Prometheus + Alertmanager + Grafana + Prometheus Operator, gói trong một chart.
#
# Operator mới là phần quan trọng: nó biến các tài nguyên ServiceMonitor và
# PodMonitor thành cấu hình scrape. Không có nó, bạn sẽ phải sửa prometheus.yml
# bằng tay — đúng cái lối làm việc mà Kubernetes khiến không thể duy trì nổi
# (pod sinh ra rồi mất đi, IP đổi sau mỗi lần restart).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.0.0
    helm:
      releaseName: prometheus
      values: |
        # ---- Prometheus ----
        prometheus:
          prometheusSpec:
            # 24 giờ dữ liệu lấy mỗi 30 giây cho khoảng 15 target là vài trăm
            # MB. Mặc định là 10 ngày, đủ làm đầy đĩa laptop rồi âm thầm ngừng
            # thu thập.
            retention: 24h
            retentionSize: 2GB
            scrapeInterval: 30s
            evaluationInterval: 30s

            # ĐÂY là thiết lập làm ai cũng vấp.
            #
            # Mặc định chart đặt các selector này thành `release: <tên>`, nên
            # Prometheus chỉ nhận những ServiceMonitor mang đúng nhãn đó. Đặt
            # chúng thành false (selector rỗng) khiến nó nhận MỌI ServiceMonitor
            # trong cluster — điều bạn muốn khi đang học.
            #
            # Chart go-service vẫn gắn `release: prometheus` lên ServiceMonitor
            # của nó, nên đổi dòng này về mặc định chỉ là sửa một dòng khi bạn
            # muốn tập với hành vi nghiêm ngặt.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false

            # Cho phép metrics-generator của Tempo đẩy vào đây các metric RED
            # suy ra từ span. Thiếu nó, service graph của Tempo không có nơi lưu
            # metric và service map trên Grafana sẽ trống trơn.
            enableRemoteWriteReceiver: true

            # Exemplar nối một bucket của histogram với một trace ID cụ thể —
            # chính là thao tác "bấm vào đỉnh latency, mở ra đúng trace chậm".
            # Cần bật cờ tính năng lưu exemplar.
            enableFeatures:
              - exemplar-storage

            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 896Mi

            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 3Gi

        # ---- Alertmanager ----
        # Tắt: tốn khoảng 80Mi cho một thành phần mà trong lab chẳng có chỗ nào
        # để gửi cảnh báo tới. Lab 8 sẽ bật lại và cho nó gửi vào một webhook cục bộ.
        alertmanager:
          enabled: false

        # ---- Grafana ----
        grafana:
          adminUser: admin
          adminPassword: admin
          defaultDashboardsTimezone: Asia/Ho_Chi_Minh
          # Không dùng PVC: dashboard đến từ ConfigMap (xem sidecar bên dưới),
          # nên không có trạng thái nào đáng lưu. Thứ gì bạn tạo bằng cách bấm
          # chuột sẽ mất khi restart — đó chính là bài học có chủ ý.
          persistence:
            enabled: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.kalapa.local
          sidecar:
            dashboards:
              enabled: true
              # Mọi ConfigMap ở bất kỳ namespace nào mang nhãn
              # grafana_dashboard: "1" đều được nhặt lên và nạp vào. Đó là cách
              # dashboard Kalapa vào được mà không cần đụng tới API của Grafana.
              label: grafana_dashboard
              searchNamespace: ALL
            datasources:
              enabled: true
              label: grafana_datasource
              searchNamespace: ALL
          grafana.ini:
            # Cần có để link "trace_id" từ Loki sang Tempo mở trace trong một
            # panel bên cạnh, thay vì mở một truy vấn mới.
            feature_toggles:
              enable: traceToMetrics
            users:
              default_theme: dark

        # ---- Các exporter ----
        nodeExporter:
          enabled: true
        kubeStateMetrics:
          enabled: true
        kube-state-metrics:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi

        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi

        # Những mục này scrape các thành phần control plane mà minikube hoặc
        # không phơi ra, hoặc chạy gộp trong node duy nhất. Để bật, chúng tạo ra
        # các target down vĩnh viễn và tập cho bạn thói quen phớt lờ target đỏ.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 20s, factor: 2, maxDuration: 5m }
  ignoreDifferences:
    # CA bundle của admission webhook được một Job tiêm vào lúc chạy. Nếu không
    # có khối này, Argo sẽ coi đó là drift và hoàn nguyên nó ở mỗi lần self-heal,
    # làm webhook hỏng theo chu kỳ vài phút một lần.
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
