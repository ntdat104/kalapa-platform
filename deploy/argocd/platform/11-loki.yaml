# Loki chạy chế độ SingleBinary: mọi thành phần (distributor, ingester, querier,
# compactor) gộp trong một process.
#
# Mặc định của chart là `distributed` / SimpleScalable, tức ba StatefulSet cộng
# MinIO — khoảng 1,5 GB. SingleBinary dùng lưu trữ filesystem chỉ tốn khoảng
# 250 MB và hành xử y hệt với một lab chỉ có một tenant.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.3.0
    helm:
      values: |
        deploymentMode: SingleBinary

        loki:
          # Tắt đa tenant: bật lên thì mọi lần đọc và ghi đều cần header
          # X-Scope-OrgID, và thiếu header sẽ trả về lỗi "no org id" rất khó hiểu.
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              # TSDB + v13 là schema hiện hành. Chart từ chối cài nếu không khai
              # báo schemaConfig tường minh, vì tự chọn giúp sẽ khiến một lần
              # nâng cấp sau này không thể migrate được.
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            retention_period: 72h
            # Log tới nơi với dấu thời gian cũ hơn mức này sẽ bị vứt. Một pod bị
            # lệch đồng hồ là nguyên nhân thường gặp của tình trạng "log của tôi
            # không vào Loki" mà chẳng thấy lỗi ở đâu cả.
            reject_old_samples: true
            reject_old_samples_max_age: 168h
            # Không có giới hạn này thì một pod bận rộn đủ sức ngốn hết ngân sách
            # thu nhận của cả cluster.
            ingestion_rate_mb: 8
            ingestion_burst_size_mb: 16
            # Chặn trường hợp một label có cardinality cao (ví dụ lỡ tay nâng
            # trace id thành label) làm nổ index.
            max_label_names_per_series: 20
          compactor:
            working_directory: /var/loki/compactor
            retention_enabled: true
            delete_request_store: filesystem

        singleBinary:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
          persistence:
            enabled: true
            size: 3Gi

        # Mọi thành phần bên dưới thuộc về các chế độ triển khai mở rộng. Để sót
        # bất kỳ cái nào đang bật cùng với SingleBinary sẽ tạo ra một cluster nối
        # dở dang: nhận được dữ liệu ghi vào nhưng truy vấn không trả về gì.
        backend: { replicas: 0 }
        read: { replicas: 0 }
        write: { replicas: 0 }
        ingester: { replicas: 0 }
        querier: { replicas: 0 }
        queryFrontend: { replicas: 0 }
        queryScheduler: { replicas: 0 }
        distributor: { replicas: 0 }
        compactor: { replicas: 0 }
        indexGateway: { replicas: 0 }
        bloomCompactor: { replicas: 0 }
        bloomGateway: { replicas: 0 }

        # MinIO là object store cho kiểu triển khai mở rộng; khi đã dùng lưu trữ
        # filesystem thì nó chỉ là gánh nặng thừa.
        minio:
          enabled: false

        # gateway là một nginx đứng trước Loki. Giữ nó nghĩa là luôn có một địa
        # chỉ ổn định (`loki-gateway`) dù Loki đang chạy single-binary hay sau này
        # được mở rộng — đáng giá khoảng 30Mi.
        gateway:
          enabled: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi

        monitoring:
          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false
          lokiCanary:
            enabled: false
        test:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
