# Tempo lưu trace. Khác Loki hay Prometheus, nó gần như không đánh index gì —
# trace được ghi vào kho lưu trữ theo khoá là trace ID. Đó là lý do nó rẻ để
# vận hành, và cũng là lý do câu hỏi "tìm mọi trace chậm" phải nhờ tới
# metrics-generator chứ không thể truy vấn thẳng trên trace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.24.4
    helm:
      values: |
        tempo:
          retention: 48h
          # Collector chuyển tiếp bằng OTLP; bật thêm receiver Jaeger và Zipkin
          # chỉ tạo ra những port mở mà chẳng ai ghi vào.
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          storage:
            trace:
              backend: local
              local:
                path: /var/tempo/traces
              wal:
                path: /var/tempo/wal

          metricsGenerator:
            # Suy ra các metric RED (tần suất, lỗi, thời lượng) và các cạnh của
            # service graph từ span, rồi remote-write sang Prometheus. Chính nó
            # làm đầy service map của Grafana; thiếu nó thì map trống trơn dù có
            # bao nhiêu trace đi nữa.
            enabled: true
            remoteWriteUrl: http://prometheus-kube-prometheus-prometheus.observability:9090/api/v1/write

          # Generator chỉ chạy cho những tenant đã bật các processor này. Khi tắt
          # xác thực thì tenant đúng nghĩa là "single-tenant", và khối override
          # này chính là thứ bật nó lên cho tenant đó.
          overrides:
            defaults:
              metrics_generator:
                processors:
                  - service-graphs
                  - span-metrics

          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi

        persistence:
          enabled: true
          size: 3Gi

        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
