apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  source:
    repoURL: __GIT_REPO_URL__
    targetRevision: __GIT_BRANCH__
    path: deploy/charts/kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: { duration: 20s, factor: 2, maxDuration: 5m }
  ignoreDifferences:
    # Strimzi tự điền mặc định cho một loạt trường trên tài nguyên Kafka. Thiếu
    # khối này, Application không bao giờ rời khỏi OutOfSync dù nó hoàn toàn đúng.
    - group: kafka.strimzi.io
      kind: Kafka
      jqPathExpressions:
        - '.spec.kafka.config'
    - group: kafka.strimzi.io
      kind: KafkaTopic
      jqPathExpressions:
        - '.spec.topicName'
        - '.status'
