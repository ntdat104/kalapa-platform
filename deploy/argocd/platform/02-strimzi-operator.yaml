apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: platform
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 1.2.0
    helm:
      values: |
        # Giới hạn trong namespace: một operator phạm vi toàn cluster sẽ cần
        # quyền điều hoà tài nguyên Kafka ở mọi namespace.
        watchNamespaces:
          - kafka
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            memory: 384Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
