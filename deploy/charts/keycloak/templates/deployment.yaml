apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two Keycloak pods running a schema migration
  # against the same database at the same time is a corrupted realm.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: keycloak
          image: {{ .Values.image }}
          # start-dev skips the build/optimise step and disables the hostname
          # strictness that otherwise rejects plain-HTTP access. Never use it
          # beyond a lab: it also turns off HTTPS enforcement.
          args:
            - start-dev
            - --import-realm
            - --http-port=8080
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.admin.username | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: {{ .Values.admin.password | quote }}
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://{{ .Values.database.clusterName }}-rw.{{ .Release.Namespace }}:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: password
            # The issuer claim in every token is built from this hostname.
            # If it does not match what the gateway validates against, every
            # token is rejected with "issuer mismatch" — the first thing that
            # breaks when you enable auth.
            - name: KC_HOSTNAME
              value: {{ .Values.hostname | quote }}
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_CACHE
              # local instead of the default distributed Infinispan cache:
              # single replica, and the clustered cache reserves far more heap.
              value: local
            - name: JAVA_OPTS_KC_HEAP
              value: "-Xms{{ .Values.jvm.heap }} -Xmx{{ .Values.jvm.heap }}"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          # Keycloak's health endpoints live on the management port (9000)
          # since v25 — probing 8080 returns 404 and the pod never goes ready.
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            # 60 x 5s = 5 minutes. A first start runs the full schema
            # migration against an empty database and genuinely takes minutes
            # on a laptop.
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
