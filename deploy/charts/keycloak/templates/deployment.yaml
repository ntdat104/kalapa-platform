apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  # Recreate chứ không phải RollingUpdate: hai pod Keycloak cùng chạy migration
  # schema lên cùng một database vào cùng lúc sẽ làm hỏng realm.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: keycloak
          image: {{ .Values.image }}
          # start-dev bỏ qua bước build/tối ưu và tắt chế độ kiểm tra hostname
          # nghiêm ngặt vốn sẽ từ chối truy cập HTTP thuần. Đừng bao giờ dùng nó
          # ngoài phạm vi một lab: nó cũng tắt luôn việc bắt buộc HTTPS.
          args:
            - start-dev
            - --import-realm
            - --http-port=8080
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.admin.username | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: {{ .Values.admin.password | quote }}
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://{{ .Values.database.clusterName }}-rw.{{ .Release.Namespace }}:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: password
            # Claim issuer trong mọi token được dựng từ hostname này. Nếu nó
            # không khớp với giá trị mà gateway dùng để verify thì mọi token đều
            # bị từ chối với lỗi "issuer mismatch" — thứ hỏng đầu tiên khi bạn
            # bật xác thực.
            - name: KC_HOSTNAME
              value: {{ .Values.hostname | quote }}
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_CACHE
              # Dùng local thay cho cache Infinispan phân tán mặc định: chỉ có
              # một replica, mà cache kiểu cụm thì giữ chỗ nhiều heap hơn hẳn.
              value: local
            - name: JAVA_OPTS_KC_HEAP
              value: "-Xms{{ .Values.jvm.heap }} -Xmx{{ .Values.jvm.heap }}"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          # Các endpoint health của Keycloak nằm trên port quản trị (9000) kể từ
          # v25 — dò port 8080 sẽ trả 404 và pod không bao giờ Ready.
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            # 60 x 5s = 5 phút. Lần khởi động đầu chạy toàn bộ migration schema
            # trên một database rỗng, và trên laptop thì nó mất vài phút thật.
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
