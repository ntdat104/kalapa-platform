{{/*
Realm được nhập từ một ConfigMap lúc khởi động, nhờ vậy cấu hình định danh cũng
nằm trong Git như mọi thứ khác. Bấm chuột tạo realm trong giao diện quản trị thì
vẫn chạy, nhưng đó là trạng thái không ai tái tạo được và không ai ghi lại —
ngay cả khi dữ liệu không mất (ở đây ta dùng Postgres chứ không phải H2).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  kalapa-realm.json: |
    {
      "realm": "{{ .Values.realm.name }}",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": false,
      "accessTokenLifespan": 1800,
      "roles": {
        "realm": [
          { "name": "kyc-officer", "description": "Can submit and read KYC applications" },
          { "name": "risk-analyst", "description": "Can read credit scores" }
        ]
      },
      "clients": [
        {
          "clientId": "{{ .Values.realm.apiClientId }}",
          "name": "Kalapa API",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "defaultClientScopes": ["profile", "email", "roles"],
          "protocolMappers": [
            {
              "name": "audience-mapper",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "{{ .Values.realm.apiClientId }}",
                "access.token.claim": "true"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "username": "{{ .Values.realm.demoUser.username }}",
          "enabled": true,
          "emailVerified": true,
          "email": "{{ .Values.realm.demoUser.username }}@kalapa.local",
          "firstName": "Demo",
          "lastName": "Officer",
          "credentials": [
            { "type": "password", "value": "{{ .Values.realm.demoUser.password }}", "temporary": false }
          ],
          "realmRoles": ["kyc-officer", "risk-analyst"]
        }
      ]
    }
