image: quay.io/keycloak/keycloak:26.4.0
hostname: identity.kalapa.local

admin:
  username: admin
  password: admin

database:
  clusterName: keycloak-db
  image: ghcr.io/cloudnative-pg/postgresql:17.5
  username: keycloak
  password: keycloak-dev-password
  storageSize: 1Gi

realm:
  name: kalapa
  apiClientId: kalapa-api
  demoUser:
    username: officer
    password: officer

jvm:
  # Keycloak is the single largest consumer in this stack. 512m heap inside a
  # 768Mi limit is the floor that still starts reliably; below it the realm
  # import OOMs partway through and leaves a half-created realm.
  heap: 512m

resources:
  requests:
    cpu: 200m
    memory: 640Mi
  limits:
    memory: 896Mi

ingress:
  enabled: true
  className: nginx
