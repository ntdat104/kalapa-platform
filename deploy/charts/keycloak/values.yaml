image: quay.io/keycloak/keycloak:26.4.0
hostname: identity.kalapa.local

admin:
  username: admin
  password: admin

database:
  clusterName: keycloak-db
  image: ghcr.io/cloudnative-pg/postgresql:17.5
  username: keycloak
  password: keycloak-dev-password
  storageSize: 1Gi

realm:
  name: kalapa
  apiClientId: kalapa-api
  demoUser:
    username: officer
    password: officer

jvm:
  # Keycloak là thành phần ngốn bộ nhớ nhất trong cả stack này. Heap 512m bên
  # trong giới hạn 768Mi là ngưỡng sàn mà nó vẫn khởi động ổn định; thấp hơn thì
  # quá trình nhập realm bị OOM giữa chừng và để lại một realm dở dang.
  heap: 512m

resources:
  requests:
    cpu: 200m
    memory: 640Mi
  limits:
    memory: 896Mi

ingress:
  enabled: true
  className: nginx
