# Scoring là một consumer Kafka, kèm một bề mặt HTTP chỉ để đọc.
go-service:
  nameOverride: scoring
  fullnameOverride: scoring

  image:
    repository: ghcr.io/kalapa-lab/kalapa-scoring
    tag: latest

  extraConfigMap: kalapa-scoring-config
  extraConfigKey: scoring.yaml

  envFromSecrets:
    - kalapa-postgres-credentials

  ingress:
    enabled: false

  # Một replica, có chủ ý. Topic chỉ có một partition, nên replica thứ hai sẽ
  # vào consumer group, không được giao gì, rồi ngồi không. Scale consumer vượt
  # số partition là kiểu scale vô ích phổ biến nhất trong một hệ Kafka — lab 3
  # bắt bạn tăng cả hai cùng lúc rồi quan sát rebalance trong log.
  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 48Mi
    limits:
      cpu: 300m
      memory: 96Mi
  goMemLimit: "72MiB"

  probes:
    startup:
      periodSeconds: 2
      failureThreshold: 45

  networkPolicy:
    enabled: false
    allowFromPods:
      - gateway
    allowToNamespaces:
      - data
      - kafka
      - observability

  config:
    marker: scoring-v1
