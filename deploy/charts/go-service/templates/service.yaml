apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-service.fullname" . }}
  labels:
    {{- include "go-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: admin
      port: {{ .Values.ports.admin }}
      targetPort: admin
      protocol: TCP
  selector:
    {{- include "go-service.selectorLabels" . | nindent 4 }}
