{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "go-service.serviceAccountName" . }}
  labels:
    {{- include "go-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Each service gets its own identity even though none of them call the API
# server today. It costs nothing now and means adding an RBAC rule later
# does not widen access for every other service at the same time.
automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
{{- end }}
