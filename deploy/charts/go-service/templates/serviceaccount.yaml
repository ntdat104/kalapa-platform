{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "go-service.serviceAccountName" . }}
  labels:
    {{- include "go-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Mỗi service có một danh tính riêng dù hiện chẳng service nào gọi API server.
# Bây giờ nó không tốn gì, và nghĩa là sau này thêm một luật RBAC sẽ không nới
# quyền cho mọi service khác cùng lúc.
automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
{{- end }}
