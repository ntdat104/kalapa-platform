{{- if .Values.ingress.enabled -}}
{{- $fullName := include "go-service.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "go-service.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $fullName }}
                # Luôn là port http. Trỏ Ingress vào port admin sẽ công khai
                # /metrics và các endpoint health ra Internet — đó là cách một
                # cluster để lộ cấu trúc của chính nó.
                port:
                  number: {{ $svcPort }}
          {{- end }}
{{- end }}
