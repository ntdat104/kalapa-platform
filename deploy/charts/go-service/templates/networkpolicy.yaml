{{- if .Values.networkPolicy.enabled }}
{{/*
NetworkPolicy là MẶC ĐỊNH CHO PHÉP cho tới khi có policy đầu tiên chọn một pod;
từ lúc đó, pod được chọn thành MẶC ĐỊNH TỪ CHỐI cho các hướng mà policy liệt kê.
Nghĩa là policy đầu tiên bạn viết sẽ khoá sạch mọi thứ, và sau đó bạn phải mở
lại DNS cùng mọi luồng hợp lệ. Đó là cách phổ biến nhất khiến một đợt triển khai
NetworkPolicy làm hỏng cluster.

LƯU Ý: CNI mặc định của minikube KHÔNG thực thi NetworkPolicy. Các object này
vẫn được tạo và chẳng làm gì cả, cho tới khi bạn dựng cluster với một CNI có
thực thi (`minikube start --cni=calico`). docs/02-kubernetes-deep-dive.md hướng
dẫn cách tự kiểm chứng cả hai trường hợp — một policy bạn chưa kiểm chứng là một
policy bạn không có.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "go-service.fullname" . }}
  labels:
    {{- include "go-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "go-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus phải tới được port quản trị, nếu không mọi target down cùng lúc.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: admin
          protocol: TCP
    {{- with .Values.networkPolicy.allowFromNamespaces }}
    - from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.allowFromPods }}
    - from:
        {{- range . }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
  egress:
    # DNS trước tiên. Quên nó là lỗi kinh điển: mọi lời gọi ra ngoài đều chết ở
    # bước phân giải tên, trong khi log lại đổ lỗi cho service đích.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.allowToNamespaces }}
    - to:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
