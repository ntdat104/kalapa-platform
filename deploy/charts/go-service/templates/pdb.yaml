{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "go-service.fullname" . }}
  labels:
    {{- include "go-service.labels" . | nindent 4 }}
spec:
  # PDB chỉ ràng buộc gián đoạn TỰ NGUYỆN: drain node, cluster autoscaler thu
  # hẹp, `kubectl drain`. Nó không làm gì với kernel panic hay OOM kill, và nó
  # không thay thế cho việc có nhiều hơn một replica.
  #
  # Cái bẫy kinh điển: minAvailable: 1 trên một Deployment chỉ có một replica sẽ
  # làm `kubectl drain` treo vĩnh viễn, vì evict pod duy nhất sẽ vi phạm ngân
  # sách. Trên cluster lab một node thì đó là treo chắc chắn, nên mặc định tắt
  # và chỉ nên bật cùng lúc với replicaCount >= 2.
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "go-service.selectorLabels" . | nindent 6 }}
{{- end }}
