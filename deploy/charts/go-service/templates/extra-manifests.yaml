{{/*
Cửa thoát hiểm cho những object dùng một lần mà một service cần nhưng chart gốc
không nên biết tới — một Job, một ConfigMap, một ExternalSecret. `tpl` được áp
dụng để chính giá trị đó cũng có thể chứa biểu thức template.

Nó tồn tại để "service của tôi cần thêm một object" không bao giờ trở thành lý
do phải fork chart gốc.
*/}}
{{- range .Values.extraObjects }}
---
{{- if typeIs "string" . }}
{{- tpl . $ }}
{{- else }}
{{- tpl (toYaml .) $ }}
{{- end }}
{{- end }}
