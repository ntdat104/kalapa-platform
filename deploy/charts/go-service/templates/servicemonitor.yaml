{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "go-service.fullname" . }}
  labels:
    {{- include "go-service.labels" . | nindent 4 }}
    # CR Prometheus do kube-prometheus-stack tạo chỉ nhận những ServiceMonitor
    # khớp serviceMonitorSelector của nó. Chart đặt selector đó thành
    # `release: <tên release helm>`, nên chính label này quyết định giữa "metric
    # được scrape" và "bị bỏ qua âm thầm".
    #
    # Khi một target mất tích, hãy xem Prometheus thực sự chịu nhận gì:
    #   kubectl -n observability get prometheus -o yaml | grep -A5 serviceMonitorSelector
    release: {{ .Values.serviceMonitor.prometheusRelease }}
spec:
  selector:
    matchLabels:
      {{- include "go-service.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    # Scrape port quản trị, vốn không được Ingress định tuyến tới.
    - port: admin
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      relabelings:
        # Không có phần này thì mọi chuỗi chỉ mang nhãn `pod=kyc-7d9f...-x2k4`
        # và không gì khác. Nâng tên pod và tên node lên thành nhãn mới cho phép
        # đối chiếu một đợt tăng metric với đúng node nơi nó xảy ra.
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
{{- end }}
