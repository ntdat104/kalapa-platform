apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "go-service.fullname" . }}
  labels:
    {{- include "go-service.labels" . | nindent 4 }}
  annotations:
    # Reloader theo dõi các ConfigMap/Secret mà pod này mount và restart
    # Deployment khi nội dung của chúng đổi. Không có nó, sửa ConfigMap chỉ cập
    # nhật file được mount còn process thì không bao giờ đọc lại.
    reloader.stakater.com/search: "true"
    {{- with .Values.deployment.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # Bỏ hẳn trường này khi HPA sở hữu nó. Đặt cả hai thì Helm và HPA đánh nhau:
  # mỗi lần đồng bộ lại kéo số replica về giá trị cứng, xoá quyết định của HPA.
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable: 0 nghĩa là pod mới phải qua readiness probe rồi mới gỡ
      # một pod cũ — không gián đoạn, đổi lại cần chỗ trống cho một pod dư.
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
      maxSurge: {{ .Values.strategy.maxSurge }}
  selector:
    matchLabels:
      {{- include "go-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "go-service.configChecksum" . }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "go-service.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "go-service.serviceAccountName" . }}
      # Pod không nói chuyện với API server nên chẳng dùng gì tới token được
      # mount. Tắt nó đi là gỡ bỏ một thông tin đăng nhập mà kẻ tấn công vốn có
      # thể nhặt ngay trong filesystem.
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      volumes:
        - name: platform-config
          configMap:
            name: {{ .Values.configMapName }}
        {{- if .Values.extraConfigMap }}
        - name: service-config
          configMap:
            name: {{ .Values.extraConfigMap }}
        {{- end }}
        {{- if .Values.securityContext.readOnlyRootFilesystem }}
        # Filesystem gốc chỉ-đọc vẫn cần một chỗ ghi được cho file tạm;
        # emptyDir cho điều đó mà không phải mở quyền ghi cho /.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: {{ include "go-service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.http }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.ports.admin }}
              protocol: TCP
          envFrom:
            # Thông tin đăng nhập đến dưới dạng biến môi trường từ Secret, không
            # bao giờ qua ConfigMap được mount: nội dung ConfigMap hiện ra trong
            # `helm get values`, `kubectl describe` và cả giao diện Argo CD.
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: SERVICE_NAME
              value: {{ include "go-service.name" . }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: CONFIG_FILE
              value: /etc/kalapa/config.yaml
            {{- if .Values.extraConfigMap }}
            - name: CONFIG_EXTRA_FILES
              value: /etc/kalapa/service/{{ .Values.extraConfigKey }}
            {{- end }}
            # GOMAXPROCS phải bám theo LIMIT CPU, không phải số lõi của node.
            # Để mặc, Go runtime thấy cả 10 lõi của host, khởi 10 luồng thực thi,
            # và bộ lập lịch thrash khi bị nhốt trong hạn mức 300m.
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
                  divisor: "1"
            # GOMEMLIMIT là trần mềm khiến bộ dọn rác làm việc mạnh hơn khi heap
            # tiến gần trần cgroup, thay vì để nhân OOM-kill pod. Đặt thấp hơn
            # limits.memory để chừa chỗ cho stack và cho bản thân runtime.
            - name: GOMEMLIMIT
              value: {{ .Values.goMemLimit | quote }}
            # Downward API: các giá trị này trở thành thuộc tính tài nguyên trên
            # mọi span và mọi dòng log — chính chúng cho phép bạn lọc một trace
            # xuống đúng một pod trong lúc một đợt rollout đang hỏng.
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: platform-config
              mountPath: /etc/kalapa
              readOnly: true
            {{- if .Values.extraConfigMap }}
            - name: service-config
              mountPath: /etc/kalapa/service
              readOnly: true
            {{- end }}
            {{- if .Values.securityContext.readOnlyRootFilesystem }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # startupProbe chắn hai probe kia. Nó cho phép lần khởi động đầu chậm
          # (chạy migration, lấy metadata Kafka) mà không phải nới lỏng liveness
          # probe — vốn sẽ chậm phát hiện treo thật trong suốt phần đời còn lại
          # của pod.
          startupProbe:
            httpGet:
              path: /healthz/live
              port: admin
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: admin
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: admin
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            successThreshold: 1
            timeoutSeconds: 3
          lifecycle:
            preStop:
              # Việc gỡ endpoint diễn ra bất đồng bộ: kube-proxy và Ingress
              # controller biết tin pod sắp chết đúng vào lúc kubelet gửi
              # SIGTERM. Khoảng dừng này giữ cho container vẫn phục vụ trong khi
              # tin đó lan đi, nhờ vậy loại bỏ được mấy con 502 mà bạn vẫn thấy
              # ở mọi lần rolling update.
              #
              # Dùng lifecycle action `sleep` gốc (GA từ v1.33) thay cho
              # `exec: ["sh","-c","sleep 5"]` là có chủ ý — image distroless
              # không có shell, nên dạng exec sẽ thất bại âm thầm và bạn ngồi
              # debug mấy con 502 ma.
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      # Phải lớn hơn thời gian ngủ preStop cộng shutdownTimeout của ứng dụng,
      # nếu không kubelet sẽ SIGKILL giữa chừng và cắt ngang request đang chạy.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
