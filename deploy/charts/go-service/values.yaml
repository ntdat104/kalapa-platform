# Giá trị nền cho mọi service Go của Kalapa.
# Các chart service chỉ ghi đè phần khác biệt; thứ gì không khai báo ở đó sẽ
# dùng các con số dưới đây, vốn được chỉnh cho minikube một node 8 GB.

replicaCount: 1

# Giữ lại bao nhiêu ReplicaSet cũ để rollback. Mặc định của Kubernetes là 10,
# nghĩa là mười object ReplicaSet chết cho mỗi service nằm mãi trong etcd và
# làm rác `kubectl get all`.
revisionHistoryLimit: 3

image:
  repository: ghcr.io/kalapa-lab/kalapa-gateway
  # `latest` là cái bẫy dưới GitOps: Argo CD không có cách nào biết tag này giờ
  # trỏ tới một digest khác, nên nó báo Synced trong khi cluster chạy code cũ.
  # Workflow CD sẽ ghi đè trường này bằng tag short-SHA bất biến; `latest` chỉ
  # có tác dụng trước lần chạy pipeline đầu tiên.
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

ports:
  http: 8080   # traffic nghiệp vụ, nằm sau Service và Ingress
  admin: 9090  # /healthz/*, /metrics — chỉ kubelet và Prometheus

service:
  type: ClusterIP
  port: 80

# ---------------------------------------------------------------------------
# Tài nguyên
#
# requests  -> phần scheduler giữ chỗ, đồng thời là mẫu số cho mục tiêu
#              utilisation của HPA
# limits    -> trần cgroup; vượt bộ nhớ là bị OOMKill, vượt CPU là bị throttle
#              (không bao giờ bị giết)
#
# requests == limits đưa pod vào lớp QoS Guaranteed: nó bị evict sau cùng khi
# node thiếu bộ nhớ. Để requests thấp hơn limits thì được Burstable, xếp chỗ
# tiết kiệm hơn nhưng đứng đầu hàng bị evict. Trên lab một node nơi các thành
# phần nền tảng mới là thứ ngốn bộ nhớ, để pod ứng dụng ở Burstable là đánh đổi
# hợp lý.
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 50m
    memory: 48Mi
  limits:
    cpu: 300m
    memory: 96Mi

# Trần mềm cho heap của bộ dọn rác Go. Giữ nó thấp hơn limits.memory khoảng
# 25%: phần chênh dành cho stack của goroutine, phần runtime tự cấp phát và
# phân mảnh — những thứ GOMEMLIMIT không quản.
goMemLimit: "72MiB"

strategy:
  # maxUnavailable: 0 -> pod thay thế phải Ready trước khi pod cũ bị gỡ.
  maxUnavailable: 0
  maxSurge: 1

# Khoảng dừng preStop cộng thời gian xả request đang chạy phải lọt trong khoảng
# ân hạn:  preStopSleepSeconds (5) + shutdownTimeout của app (20) = 25 < 45
terminationGracePeriodSeconds: 45
preStopSleepSeconds: 5

probes:
  # startup: cho phép 30 x 2s = 60s để chạy migration và lấy metadata Kafka lần
  # đầu, trước khi liveness bắt đầu đếm.
  startup:
    periodSeconds: 2
    failureThreshold: 30
  liveness:
    periodSeconds: 10
    # 3 x 10s = 30s hỏng liên tục mới restart. Chặt hơn mức này thì một lần GC
    # dừng lâu hoặc một node chậm cũng đủ làm restart một pod đang khoẻ.
    failureThreshold: 3
  readiness:
    periodSeconds: 5
    # Cố ý hỏng nhanh hơn liveness: gỡ một pod đang vật lộn ra khỏi load
    # balancer thì rẻ và đảo ngược được, còn restart nó thì không.
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Ngữ cảnh bảo mật
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  # 65532 là user `nonroot` của distroless. Nó PHẢI khớp dòng USER trong
  # build/Dockerfile, nếu không container không đọc được chính file nhị phân
  # của mình.
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    # RuntimeDefault chặn khoảng 44 syscall hiếm dùng. Bắt buộc với Pod Security
    # Standard mức `restricted`, và chẳng tốn gì với một service Go.
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # Một file nhị phân Go tĩnh không cần capability nào cả, kể cả bộ mặc định.
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Các service này không bao giờ gọi API server, nên token được mount vào pod
# thuần tuý chỉ là bề mặt tấn công.
automountServiceAccountToken: false

# ---------------------------------------------------------------------------
# Cấu hình
# Phần không nhạy cảm đến từ một ConfigMap dùng chung mount tại /etc/kalapa;
# phần bí mật đến dưới dạng biến môi trường từ Secret. Reloader restart pod khi
# một trong hai thay đổi.
# ---------------------------------------------------------------------------
configMapName: kalapa-config
extraConfigMap: ""      # ConfigMap phủ riêng cho từng service (tuỳ chọn)
extraConfigKey: ""      # khoá bên trong nó, ví dụ "kyc.yaml"

# Được đưa vào annotation checksum của pod template, để `helm upgrade` tự roll
# lại Deployment khi cấu hình đổi, kể cả khi không có Reloader.
config: {}

envFromSecrets:
  - kalapa-postgres-credentials

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
extraObjects: []

deployment:
  annotations: {}
podAnnotations: {}
podLabels: {}

# ---------------------------------------------------------------------------
# Ingress — chỉ gateway bật phần này.
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  host: kalapa.local
  annotations: {}
  paths:
    - path: /
      pathType: Prefix
  tls: []

# ---------------------------------------------------------------------------
# Tự động co giãn. Mặc định tắt: trên cluster một node, HPA tranh cùng vài
# gigabyte với các thành phần nền tảng. Lab 4 sẽ bật nó.
# ---------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  scaleUpStabilizationSeconds: 30
  scaleDownStabilizationSeconds: 300

podDisruptionBudget:
  # Xem chú thích trong templates/pdb.yaml: bật cái này cùng replicaCount: 1 sẽ
  # làm `kubectl drain` treo vĩnh viễn.
  enabled: false
  minAvailable: ""
  maxUnavailable: 1

serviceMonitor:
  enabled: true
  # Phải bằng đúng tên release Helm của kube-prometheus-stack, nếu không
  # Prometheus sẽ không nhận ServiceMonitor này.
  prometheusRelease: prometheus
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s

networkPolicy:
  # Mặc định tắt vì CNI mặc định của minikube âm thầm bỏ qua các object này —
  # xem templates/networkpolicy.yaml.
  enabled: false
  allowFromNamespaces: []
  allowFromPods: []
  allowToNamespaces:
    - data
    - kafka
    - observability
    - identity
  extraEgress: []

topologySpreadConstraints: []
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
