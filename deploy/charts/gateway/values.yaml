# Gateway là service duy nhất có Ingress và cũng là service duy nhất nói chuyện
# với Keycloak. Nó không có database nên không khai báo thông tin đăng nhập
# Postgres nào.
go-service:
  nameOverride: gateway
  fullnameOverride: gateway

  image:
    repository: ghcr.io/kalapa-lab/kalapa-gateway
    tag: latest

  extraConfigMap: kalapa-gateway-config
  extraConfigKey: gateway.yaml

  # Không có DB nên không cần Secret Postgres. Việc mỗi service chỉ mount đúng
  # thông tin đăng nhập nó thực sự cần chính là lý do tách Secret ra từng cái.
  envFromSecrets: []

  ingress:
    enabled: true
    className: nginx
    host: api.kalapa.local
    annotations:
      # Service Go phía sau đã có timeout 10 giây ở phía client; để NGINX chờ
      # lâu hơn chỉ tạo ra những kết nối sống lâu hơn cả request.
      nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
      # Giới hạn kích thước thân request ngay ở biên, để một lần upload quá khổ
      # bị từ chối trước khi nó kịp chạm tới một pod chỉ có 96Mi.
      nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    paths:
      - path: /api
        pathType: Prefix

  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 300m
      memory: 64Mi
  goMemLimit: "48MiB"

  networkPolicy:
    enabled: false
    # Chỉ Ingress controller được phép tới port HTTP của gateway.
    allowFromNamespaces:
      - ingress-nginx
    allowToNamespaces:
      - kalapa
      - identity
      - observability

  config:
    marker: gateway-v1
