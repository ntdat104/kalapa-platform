apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ .Values.topic.name }}
  labels:
    strimzi.io/cluster: {{ .Values.cluster.name }}
spec:
  # Số partition là trần cứng cho mức song song của consumer: một group không
  # bao giờ có nhiều consumer hữu dụng hơn số partition. Số này tăng được về sau
  # nhưng không bao giờ giảm được, và tăng lên sẽ phân bố lại key giữa các
  # partition — làm hỏng thứ tự theo key với mọi key bị dời chỗ.
  partitions: {{ .Values.topic.partitions }}
  replicas: {{ .Values.topic.replicas }}
  config:
    retention.ms: {{ .Values.topic.retentionMs | quote }}
    segment.bytes: {{ .Values.topic.segmentBytes | quote }}
    # compact chỉ giữ bản ghi mới nhất của mỗi key — đúng cho một topic lưu
    # trạng thái, sai cho một nhật ký sự kiện nơi mọi lần nộp đều quan trọng.
    cleanup.policy: delete
