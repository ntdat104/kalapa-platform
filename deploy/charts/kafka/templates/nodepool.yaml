{{/*
KafkaNodePool là cách Strimzi mô hình hoá một nhóm node kể từ khi ZooKeeper bị
gỡ bỏ. Strimzi 1.x chỉ chạy KRaft: không còn `spec.zookeeper` nữa, và một tài
nguyên Kafka không có lấy một node pool sẽ không bao giờ đạt Ready.

Vai trò:
  controller -> chạy quorum Raft giữ metadata của cluster
  broker     -> lưu partition và phục vụ client

Ở production người ta tách hai vai trò thành hai pool, để một lần restart
controller không làm gián đoạn việc phục vụ dữ liệu. Ở đây dùng một node gộp vì
hai pool nghĩa là hai JVM, mà JVM thứ hai tốn khoảng 700Mi mà cluster này không có.
*/}}
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ .Values.nodePool.name }}
  labels:
    # Thiếu nhãn này thì pool bị mồ côi: operator dùng nó để biết pool thuộc về
    # cluster Kafka nào.
    strimzi.io/cluster: {{ .Values.cluster.name }}
spec:
  replicas: {{ .Values.nodePool.replicas }}
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: {{ .Values.nodePool.storage.size }}
    # false -> PVC sống sót qua `helm uninstall`. Đặt true nếu bạn hay xoá đi
    # dựng lại lab, không thì sẽ rò rỉ volume.
    deleteClaim: {{ .Values.nodePool.storage.deleteClaim }}
  resources:
    requests:
      cpu: {{ .Values.nodePool.resources.requests.cpu }}
      memory: {{ .Values.nodePool.resources.requests.memory }}
    limits:
      memory: {{ .Values.nodePool.resources.limits.memory }}
  jvmOptions:
    # -Xms == -Xmx tránh những lần dừng do heap phải co giãn. Cả hai đặt thấp
    # hơn hẳn giới hạn container vì thứ thực sự ngốn bộ nhớ của Kafka là page
    # cache của hệ điều hành chứ không phải heap — chừa khoảng 40% giới hạn
    # ngoài heap mới là thứ giữ cho broker không bị OOM killer sờ tới.
    -Xms: {{ .Values.nodePool.jvm.heap }}
    -Xmx: {{ .Values.nodePool.jvm.heap }}
