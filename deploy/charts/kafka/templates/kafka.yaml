apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.cluster.name }}
  # NOTE on API versions. Strimzi 1.x serves `kafka.strimzi.io/v1`. YAS and
  # most tutorials still use `v1beta2`, which this operator does not serve at
  # all — the symptom is a flat `no matches for kind "Kafka"` even though the
  # CRD is clearly installed. Always check what is actually served:
  #
  #   kubectl api-resources --api-group=kafka.strimzi.io
  #
  # The `strimzi.io/node-pools: enabled` and `strimzi.io/kraft: enabled`
  # annotations that v1beta2 required are gone too: on v1 both are mandatory
  # and the annotations are ignored.
spec:
  kafka:
    version: {{ .Values.cluster.version }}
    # Replicas and storage live in the KafkaNodePool, not here. Setting them in
    # both places is the most common Strimzi migration error.
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # Every replication factor must be 1 on a single-broker cluster. Leaving
      # the default of 3 makes the internal topics undercreatable and the
      # cluster never reaches Ready — with an error that does not mention
      # replication at all.
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      # Allow the services to create topics they reference before the
      # KafkaTopic resource is reconciled, so a first boot does not fail on
      # ordering.
      auto.create.topics.enable: "true"
  entityOperator:
    # The topic operator is what turns KafkaTopic resources into real topics —
    # without it the KafkaTopic below is an inert object.
    topicOperator:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 192Mi
    userOperator:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 192Mi
