apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.cluster.name }}
  # LƯU Ý về phiên bản API. Strimzi 1.x phục vụ `kafka.strimzi.io/v1`. YAS và
  # hầu hết hướng dẫn cũ vẫn dùng `v1beta2`, mà operator này hoàn toàn không
  # phục vụ — triệu chứng là lỗi cụt lủn `no matches for kind "Kafka"` dù CRD rõ
  # ràng đã được cài. Luôn kiểm tra xem thực tế đang phục vụ phiên bản nào:
  #
  #   kubectl api-resources --api-group=kafka.strimzi.io
  #
  # Hai annotation `strimzi.io/node-pools: enabled` và `strimzi.io/kraft:
  # enabled` mà v1beta2 đòi hỏi cũng không còn: trên v1 cả hai đều là bắt buộc
  # nên annotation bị bỏ qua.
spec:
  kafka:
    version: {{ .Values.cluster.version }}
    # Số replica và phần lưu trữ nằm trong KafkaNodePool chứ không nằm ở đây.
    # Khai báo ở cả hai chỗ là lỗi chuyển đổi Strimzi phổ biến nhất.
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # Mọi hệ số nhân bản phải bằng 1 trên cluster một broker. Để mặc định là 3
      # thì các topic nội bộ không tạo nổi và cluster không bao giờ đạt Ready —
      # kèm một thông báo lỗi chẳng nhắc gì tới chuyện nhân bản.
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      # Cho phép service tự tạo topic nó tham chiếu trước khi tài nguyên
      # KafkaTopic kịp được điều hoà, để lần khởi động đầu không hỏng vì thứ tự.
      auto.create.topics.enable: "true"
  entityOperator:
    # Topic operator chính là thứ biến tài nguyên KafkaTopic thành topic thật —
    # thiếu nó thì KafkaTopic bên dưới chỉ là một object nằm im.
    topicOperator:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 192Mi
    userOperator:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 192Mi
