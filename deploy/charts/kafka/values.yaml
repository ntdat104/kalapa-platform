cluster:
  name: kalapa
  # Phải là một trong các phiên bản mà BẢN operator NÀY hỗ trợ. Strimzi 1.2.0
  # hỗ trợ 4.2.0, 4.2.1, 4.3.0 và 4.3.1 — không có bản nào cũ hơn. Chọn sai thì
  # tài nguyên Kafka đơn giản là không bao giờ Ready; lý do chỉ nằm trong
  # status của CR, không có trong bất kỳ event nào:
  #
  #   kubectl -n kafka get kafka kalapa -o jsonpath='{.status.conditions}' | jq
  #
  # Để liệt kê những phiên bản operator đã cài chấp nhận:
  #   kubectl -n kafka get deploy strimzi-cluster-operator -o yaml \
  #     | grep -A3 STRIMZI_KAFKA_IMAGES
  version: "4.3.1"

nodePool:
  name: combined
  replicas: 1
  storage:
    size: 5Gi
    deleteClaim: false
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      memory: 1Gi
  # Heap giữ ở khoảng 50% giới hạn; phần còn lại dành cho page cache và chi phí
  # chung của JVM.
  jvm:
    heap: 512m

topic:
  name: kyc.application.submitted
  partitions: 1
  replicas: 1
  # Bọc nháy có chủ ý. Helm đọc một số nguyên lớn không nháy thành float64, rồi
  # `| quote` in nó ra dạng ký hiệu khoa học — 10485760 thành "1.048576e+07",
  # và Kafka từ chối với lỗi:
  #
  #   Invalid value 1.048576e+07 for configuration segment.bytes:
  #   Not a number of type INT
  #
  # KafkaTopic vẫn được tạo, kẹt ở Ready=False, và manh mối duy nhất nằm trong
  # status của nó. Bọc nháy ngay trong values.yaml giữ giá trị là chuỗi từ đầu
  # tới cuối. Cùng cái bẫy đó áp cho mọi giá trị lớn hơn khoảng 2^24 đi qua
  # `| quote`.
  retentionMs: "604800000"   # 7 days
  segmentBytes: "10485760"   # 10Mi — small segments so retention is observable
