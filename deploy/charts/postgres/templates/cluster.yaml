{{/*
CloudNativePG thay thế lối làm StatefulSet-cộng-script bằng một operator nắm
luôn việc failover, sao lưu và các điểm kết nối.

Operator tạo ra những gì cho một Cluster tên `kalapa-db`:
  kalapa-db-rw   -> luôn là primary hiện tại (đọc và ghi)
  kalapa-db-ro   -> chỉ các replica; rỗng khi instances: 1
  kalapa-db-r    -> instance bất kỳ
Ứng dụng trỏ vào -rw. Khi failover, operator chuyển hướng Service đó, nên không
cấu hình ứng dụng nào phải đổi và không cần restart gì.
*/}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/part-of: kalapa
spec:
  # Một instance trên lab một node. Ở production câu trả lời là ba, và thứ duy
  # nhất phải đổi là con số này — operator lo phần còn lại.
  instances: {{ .Values.instances }}
  imageName: {{ .Values.image }}

  postgresql:
    parameters:
      # Chỉnh cho một container 256Mi chứ không phải một máy chủ. shared_buffers
      # bằng 25% giới hạn bộ nhớ là điểm khởi đầu thông dụng.
      shared_buffers: {{ .Values.parameters.sharedBuffers | quote }}
      max_connections: {{ .Values.parameters.maxConnections | quote }}
      # Bật sẵn logical replication để sau này thêm được lab CDC (Debezium) mà
      # không phải restart — đổi wal_level thì buộc phải restart.
      wal_level: logical
      max_wal_senders: "10"
      max_replication_slots: "10"
      # Ghi log mọi câu lệnh chậm hơn một giây; chính nó làm đầy panel "truy vấn
      # chậm" mà không cần tới pg_stat_statements.
      log_min_duration_statement: "1000"

  bootstrap:
    initdb:
      database: {{ .Values.database }}
      owner: {{ .Values.owner }}
      # Operator sẽ tự sinh mật khẩu nếu không được trỏ tới một Secret. Ta trỏ
      # nó vào đúng Secret mà các pod ứng dụng đọc, nhờ vậy hai bên không thể
      # lệch nhau — lệch ở đây tạo ra lỗi xác thực trông y hệt một sự cố mạng.
      secret:
        name: {{ .Values.credentialsSecret }}
      postInitApplicationSQL:
        # Hai service dùng chung một database và tách nhau theo bảng chứ không
        # theo schema. Hệ thống thật thì nên mỗi service một database; lối tắt
        # dùng chung một database ở đây tiết kiệm khoảng 120Mi và một Cluster nữa.
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements

  storage:
    size: {{ .Values.storage.size }}
    {{- with .Values.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}

  resources:
    requests:
      cpu: {{ .Values.resources.requests.cpu }}
      memory: {{ .Values.resources.requests.memory }}
    limits:
      memory: {{ .Values.resources.limits.memory }}

  # Xuất pg_stat_* thành metric Prometheus trên port 9187. Operator cũng tạo kèm
  # một PodMonitor khi bật tuỳ chọn bên dưới.
  monitoring:
    enablePodMonitor: {{ .Values.monitoring.enabled }}

  affinity:
    # Vô nghĩa trên một node, nhưng đúng ở mọi nơi khác: không bao giờ xếp hai
    # instance của cùng một cluster lên cùng một node.
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
