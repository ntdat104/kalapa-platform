{{/*
CloudNativePG đòi một Secret loại kubernetes.io/basic-auth, còn các pod ứng dụng
lại muốn biến môi trường POSTGRES_USERNAME/POSTGRES_PASSWORD. Thay vì nhân đôi
mật khẩu thành hai dạng rồi để chúng lệch nhau, Secret này mang cả bốn khoá:
`username`/`password` cho operator, và cặp viết hoa cho envFrom.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentialsSecret }}
  labels:
    app.kubernetes.io/part-of: kalapa
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.owner | quote }}
  password: {{ .Values.password | quote }}
  POSTGRES_USERNAME: {{ .Values.owner | quote }}
  POSTGRES_PASSWORD: {{ .Values.password | quote }}
