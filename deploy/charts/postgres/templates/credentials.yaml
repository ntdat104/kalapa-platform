{{/*
CloudNativePG expects a kubernetes.io/basic-auth Secret, while the application
pods want POSTGRES_USERNAME/POSTGRES_PASSWORD env vars. Rather than duplicate
the password in two shapes and let them drift, this Secret carries all four
keys: `username`/`password` for the operator, the uppercase pair for envFrom.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentialsSecret }}
  labels:
    app.kubernetes.io/part-of: kalapa
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.owner | quote }}
  password: {{ .Values.password | quote }}
  POSTGRES_USERNAME: {{ .Values.owner | quote }}
  POSTGRES_PASSWORD: {{ .Values.password | quote }}
