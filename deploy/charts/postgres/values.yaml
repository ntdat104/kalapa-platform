name: kalapa-db
instances: 1
image: ghcr.io/cloudnative-pg/postgresql:17.5

database: kalapa
owner: kalapa
password: kalapa-dev-password
credentialsSecret: kalapa-db-credentials

parameters:
  sharedBuffers: 64MB
  # 4 kết nối/pod x 2 service có dùng DB x một chút dư. Postgres cấp phát bộ nhớ
  # cho MỖI kết nối ngay từ đầu, nên max_connections phình to là lãng phí RAM dù
  # các kết nối đó có tồn tại hay không.
  maxConnections: "50"

storage:
  size: 2Gi
  # Để rỗng -> dùng StorageClass mặc định của cluster. Trên minikube đó là
  # provisioner `standard` kiểu hostPath, nghĩa là dữ liệu nằm trên node và
  # không sống sót qua `minikube delete`.
  storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    # Cố ý không đặt limit CPU: throttle Postgres trong lúc nó replay WAL hoặc
    # chạy checkpoint sẽ biến một truy vấn chậm thành cả cluster đứng hình.
    memory: 320Mi

monitoring:
  enabled: true
