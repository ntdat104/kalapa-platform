name: kalapa-db
instances: 1
image: ghcr.io/cloudnative-pg/postgresql:17.5

database: kalapa
owner: kalapa
password: kalapa-dev-password
credentialsSecret: kalapa-db-credentials

parameters:
  sharedBuffers: 64MB
  # 4 conns/pod x 2 DB-backed services x a little headroom. Postgres allocates
  # per-connection memory up front, so an inflated max_connections wastes RAM
  # whether or not the connections exist.
  maxConnections: "50"

storage:
  size: 2Gi
  # Empty -> the cluster default. On minikube that is the `standard`
  # hostPath provisioner, which means the data lives on the node and does not
  # survive `minikube delete`.
  storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    # No CPU limit on purpose: throttling Postgres during WAL replay or a
    # checkpoint turns a slow query into a cluster-wide stall.
    memory: 320Mi

monitoring:
  enabled: true
