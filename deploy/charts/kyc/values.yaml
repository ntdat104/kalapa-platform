# KYC sở hữu đường ghi: Postgres cộng với một Kafka producer.
go-service:
  nameOverride: kyc
  fullnameOverride: kyc

  image:
    repository: ghcr.io/kalapa-lab/kalapa-kyc
    tag: latest

  extraConfigMap: kalapa-kyc-config
  extraConfigKey: kyc.yaml

  envFromSecrets:
    - kalapa-postgres-credentials

  ingress:
    # Chỉ với tới được qua gateway. Cho mỗi service một Ingress riêng chính là
    # cách một API nội bộ lọt ra Internet.
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 48Mi
    limits:
      cpu: 300m
      memory: 96Mi
  goMemLimit: "72MiB"

  probes:
    startup:
      periodSeconds: 2
      # 45 x 2s = 90s. Dài hơn các service khác vì pod này chạy migration schema
      # và chờ metadata của Kafka trong lần khởi động đầu.
      failureThreshold: 45

  networkPolicy:
    enabled: false
    allowFromPods:
      - gateway
    allowToNamespaces:
      - data
      - kafka
      - observability

  config:
    marker: kyc-v1
