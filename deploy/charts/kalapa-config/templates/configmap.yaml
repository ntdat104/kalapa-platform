# Một ConfigMap dùng chung cho mọi service, cộng thêm một lớp phủ nhỏ cho từng
# service.
#
# Vì sao dùng nền chung thay vì cấu hình riêng từng service: những địa chỉ bắt
# buộc phải khớp nhau giữa các service (địa chỉ OTLP collector, bootstrap server
# của Kafka, URL issuer) đúng là những thứ hỏng một cách khó thấy khi chúng lệch
# nhau. Khai báo một lần thì không thể lệch.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kalapa-config
  labels:
    app.kubernetes.io/part-of: kalapa
  annotations:
    # Reloader chỉ để ý những object mang annotation này, nên sửa một ConfigMap
    # không liên quan sẽ không gây restart toàn cluster.
    reloader.stakater.com/match: "true"
data:
  config.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
---
{{- range $name, $overlay := .Values.serviceConfig }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kalapa-{{ $name }}-config
  labels:
    app.kubernetes.io/part-of: kalapa
  annotations:
    reloader.stakater.com/match: "true"
data:
  {{ $name }}.yaml: |
    {{- toYaml $overlay | nindent 4 }}
---
{{- end }}
