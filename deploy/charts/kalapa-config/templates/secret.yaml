{{/*
These Secrets hold development credentials committed to Git in plaintext.
That is acceptable here and nowhere else: this is a lab cluster, the values
are `admin`/`admin`, and keeping them visible makes the wiring followable.

For anything real, pick one of:
  - Sealed Secrets   — encrypt to a cluster-specific key, commit the ciphertext
  - External Secrets — keep the value in Vault/AWS SM, sync a reference
  - SOPS + age       — encrypt in-repo, decrypt at apply time
docs/04-gitops-with-argocd.md covers the trade-offs; lab 7 has you convert
these three Secrets to Sealed Secrets.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: kalapa-postgres-credentials
  annotations:
    reloader.stakater.com/match: "true"
type: Opaque
stringData:
  # stringData rather than data: Helm would otherwise need every value
  # b64enc'd, which hides typos until the pod fails to start.
  POSTGRES_USERNAME: {{ .Values.credentials.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.credentials.postgres.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kalapa-keycloak-credentials
  annotations:
    reloader.stakater.com/match: "true"
type: Opaque
stringData:
  KEYCLOAK_GATEWAY_CLIENT_SECRET: {{ .Values.credentials.keycloak.gatewayClientSecret | quote }}
