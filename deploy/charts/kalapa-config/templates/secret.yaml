{{/*
Các Secret này chứa thông tin đăng nhập dành cho môi trường phát triển, được
commit vào Git dưới dạng chữ rõ. Điều đó chấp nhận được ở đây và không ở đâu
khác: đây là cluster lab, giá trị toàn kiểu `admin`/`admin`, và để chúng hiện ra
giúp bạn theo dõi được toàn bộ luồng.

Với bất cứ thứ gì thật, hãy chọn một trong ba:
  - Sealed Secrets   — mã hoá bằng khoá riêng của cluster, commit bản mã
  - External Secrets — giữ giá trị trong Vault/AWS SM, chỉ đồng bộ một tham chiếu
  - SOPS + age       — mã hoá ngay trong repo, giải mã lúc apply
docs/04-gitops-with-argocd.md phân tích đánh đổi của từng cách; lab 7 bắt bạn
chuyển ba Secret này sang Sealed Secrets.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: kalapa-postgres-credentials
  annotations:
    reloader.stakater.com/match: "true"
type: Opaque
stringData:
  # Dùng stringData chứ không phải data: với data thì mọi giá trị phải tự
  # b64enc, và một lỗi đánh máy chỉ lộ ra khi pod không khởi động được.
  POSTGRES_USERNAME: {{ .Values.credentials.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.credentials.postgres.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kalapa-keycloak-credentials
  annotations:
    reloader.stakater.com/match: "true"
type: Opaque
stringData:
  KEYCLOAK_GATEWAY_CLIENT_SECRET: {{ .Values.credentials.keycloak.gatewayClientSecret | quote }}
