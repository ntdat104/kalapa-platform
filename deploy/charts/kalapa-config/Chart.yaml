apiVersion: v2
name: kalapa-config
description: |
  Cấu hình và thông tin đăng nhập dùng chung cho các service Kalapa.
  Tương ứng chart `yas-configuration` của YAS.

  Lưu ý: YAS gói controller Reloader vào đây dưới dạng dependency của chart.
  Repo này thì cài Reloader thành một Argo CD Application riêng
  (deploy/argocd/platform/03-reloader.yaml). Dưới GitOps, một controller là
  thành phần nền tảng có vòng đời riêng, không phải subchart của phần cấu hình
  mà nó tình cờ theo dõi — gói chung nghĩa là mỗi thay đổi cấu hình lại render
  lại cả manifest của controller.
type: application
version: 0.1.0
appVersion: "1.0.0"
