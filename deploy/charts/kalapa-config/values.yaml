# ---------------------------------------------------------------------------
# Cấu hình dùng chung, được mount tại /etc/kalapa/config.yaml trong mọi pod
# service. Phải khớp với struct trong internal/platform/config/config.go.
# ---------------------------------------------------------------------------
config:
  service:
    environment: local
    logLevel: info

  server:
    httpPort: 8080
    adminPort: 9090
    readTimeout: 10s
    writeTimeout: 30s
    # Phải nhỏ hơn terminationGracePeriodSeconds của chart trừ đi khoảng dừng
    # preStop, nếu không kubelet sẽ SIGKILL process giữa lúc đang xả.
    shutdownTimeout: 20s

  database:
    # <service>.<namespace> — dạng ngắn chỉ phân giải được từ trong cùng
    # namespace, mà các pod này nằm ở `kalapa` còn Postgres nằm ở `data`.
    # `-rw` là Service đọc-ghi của CloudNativePG: nó luôn trỏ tới primary hiện
    # tại, nên một lần failover không đòi ứng dụng phải đổi gì.
    url: postgres://kalapa-db-rw.data:5432/kalapa?sslmode=disable
    maxConns: 4
    minConns: 0

  kafka:
    # Strimzi tạo ra <cluster>-kafka-bootstrap. Trỏ vào Service bootstrap thay
    # vì vào từng broker là điều cho phép client tự khám phá ra tập broker thật,
    # kể cả sau khi mở rộng cluster.
    brokers:
      - kalapa-kafka-bootstrap.kafka:9092
    topic: kyc.application.submitted
    consumerGroup: scoring

  tracing:
    enabled: true
    # OTLP/gRPC. Port 4317 là gRPC, 4318 là HTTP — nhầm hai cái sẽ tạo ra một
    # kết nối thiết lập được rồi âm thầm rơi hết mọi span.
    otlpEndpoint: opentelemetry-collector.observability:4317
    # 1.0 = lấy mẫu toàn bộ. Đúng cho một lab, tai hại ở production: ở lưu lượng
    # thật thì chính thiết lập này làm đầy đĩa của Tempo.
    sampleRatio: 1.0

  auth:
    # Được bật ở lab 5, sau khi Keycloak đã có realm và client.
    enabled: false
    issuerUrl: http://identity.kalapa.local/realms/kalapa
    audience: kalapa-api

  services:
    kyc: http://kyc.kalapa
    scoring: http://scoring.kalapa

# Lớp phủ riêng từng service, render thành kalapa-<tên>-config và mount tại
# /etc/kalapa/service/<tên>.yaml. Tầng sau thắng tầng trước — xem config.Load.
serviceConfig:
  kyc:
    kafka:
      topic: kyc.application.submitted
  scoring:
    kafka:
      topic: kyc.application.submitted
      consumerGroup: scoring
  gateway:
    service:
      logLevel: info

credentials:
  postgres:
    username: kalapa
    password: kalapa-dev-password
  keycloak:
    gatewayClientSecret: gateway-dev-secret
