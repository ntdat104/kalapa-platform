# Kiểm tra phần Kubernetes của repo.
#
# Dưới GitOps, một manifest sai không làm hỏng script deploy — nó hỏng âm thầm
# bên trong Argo CD, nơi có thể một tiếng nữa bạn mới nhìn vào. Các phép kiểm
# tra này dời cái hỏng đó về ngay pull request.
name: manifests

on:
  pull_request:
    paths: ['deploy/**', '.github/workflows/manifests.yaml']
  push:
    branches: [main]
    paths: ['deploy/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Lint and render every chart
        run: |
          set -euo pipefail
          helm repo add stakater https://stakater.github.io/stakater-charts
          helm repo update
          for chart in deploy/charts/*/; do
            name=$(basename "$chart")
            echo "::group::$name"
            helm dependency build "$chart" 2>/dev/null || true
            helm lint "$chart"
            # Việc render bắt được thứ lint không bắt: một template tham chiếu
            # tới một value không ai định nghĩa sẽ hỏng ở đây, chứ không hỏng
            # trong cluster.
            helm template "$name" "$chart" --namespace kalapa > "/tmp/${name}.yaml"
            echo "::endgroup::"
          done

      - name: Validate against the Kubernetes API schema
        run: |
          set -euo pipefail
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          # Các CRD (Cluster, Kafka, ServiceMonitor) không nằm trong bộ schema
          # mặc định, nên trỏ kubeconform tới kho schema CRD của cộng đồng và chỉ
          # bỏ qua đúng những thứ vẫn còn thiếu.
          /tmp/kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.34.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            /tmp/*.yaml

      - name: Check for the unsubstituted repo placeholder
        run: |
          # Một placeholder __GIT_REPO_URL__ bị push lên sẽ khiến MỌI Argo CD
          # Application không phân giải được nguồn, kèm một lỗi chẳng nhắc gì tới
          # nguyên nhân.
          if grep -rq '__GIT_REPO_URL__' deploy/argocd deploy/manifests; then
            echo "::error::run scripts/init-repo.sh before committing"
            grep -rn '__GIT_REPO_URL__' deploy/argocd deploy/manifests
            exit 1
          fi

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Render the service charts
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered
          for chart in deploy/charts/gateway deploy/charts/kyc deploy/charts/scoring; do
            helm dependency build "$chart"
            helm template "$(basename "$chart")" "$chart" -n kalapa \
              > "/tmp/rendered/$(basename "$chart").yaml"
          done

      - name: Security posture of the rendered pods
        # Những khẳng định này là thứ giữ cho securityContext của chart không
        # âm thầm bị thụt lùi. Chúng chính là bộ luật mà Pod Security Standard
        # mức `restricted` thực thi ở admission — kiểm tra ở đây nghĩa là một
        # bước lùi sẽ làm fail PR thay vì fail lúc deploy.
        run: |
          set -euo pipefail
          fail=0
          for f in /tmp/rendered/*.yaml; do
            name=$(basename "$f" .yaml)
            check() {
              if ! grep -q "$1" "$f"; then
                echo "::error file=$f::$name is missing: $2"
                fail=1
              fi
            }
            check 'runAsNonRoot: true'            'runAsNonRoot'
            check 'allowPrivilegeEscalation: false' 'allowPrivilegeEscalation: false'
            check 'readOnlyRootFilesystem: true'  'readOnlyRootFilesystem'
            check 'drop:'                          'dropped capabilities'
            check 'automountServiceAccountToken: false' 'automountServiceAccountToken: false'

            # Mọi container phải khai báo cả requests lẫn limits, nếu không pod
            # rơi vào lớp QoS BestEffort và là thứ bị evict đầu tiên.
            if ! grep -q 'requests:' "$f" || ! grep -q 'limits:' "$f"; then
              echo "::error file=$f::$name has no resource requests/limits"
              fail=1
            fi

            # Một tag có thể thay đổi khiến Argo CD báo Synced trong khi cluster
            # đang chạy code cũ.
            if grep -qE 'image: .*:latest"?$' "$f"; then
              echo "::warning file=$f::$name still uses a :latest tag"
            fi
          done
          exit $fail

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        # Các mật khẩu dành cho môi trường phát triển trong repo này là có chủ ý
        # và đã được cho phép trong .gitleaks.toml. Việc quét tồn tại để bắt một
        # mật khẩu THẬT mà ai đó dán nhầm vào sau này.
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            zricethezav/gitleaks:v8.21.2 detect \
            --source=. --config=/work/.gitleaks.toml --redact --verbose
