# CI cho các service Go.
#
# Có hai điểm khiến nó khác một lệnh `go test ./...` đơn thuần:
#
#  1. Lọc theo đường dẫn. Chỉ service nào có code thay đổi mới được build, nhưng
#     một thay đổi dưới internal/platform/ hoặc trong go.mod thì build lại TẤT
#     CẢ, vì phần đó được biên dịch vào cả ba file nhị phân. Viết sai quan hệ
#     phụ thuộc này chính là cách bạn phát hành một image cũ với bản build xanh.
#
#  2. Job cuối ghi tag image mới ngược vào values của Helm rồi push commit đó.
#     Chính commit đó là việc deploy — Argo CD thấy nó và đồng bộ. Không khâu
#     nào trong pipeline này có, hay cần, thông tin đăng nhập cluster.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Lần push thứ hai lên cùng nhánh sẽ huỷ lần đầu. Không có dòng này thì hai lần
# push cách nhau một phút sẽ tranh nhau ghi tag image, và commit của bản build
# THUA lại là bản thắng.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      charts: ${{ steps.filter.outputs.charts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'go.mod'
              - 'go.sum'
              - 'internal/platform/**'
              - 'build/Dockerfile'
              - '.github/workflows/ci.yaml'
            gateway:
              - *shared
              - 'cmd/gateway/**'
              - 'internal/gateway/**'
            kyc:
              - *shared
              - 'cmd/kyc/**'
              - 'internal/kyc/**'
            scoring:
              - *shared
              - 'cmd/scoring/**'
              - 'internal/scoring/**'
            charts:
              - 'deploy/**'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        # gofmt luôn trả về 0 dù có tìm thấy gì hay không, nên phép kiểm tra phải
        # dựa vào việc nó có in ra tên file hay không.
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd: $unformatted"
            exit 1
          fi

      - name: Tests with race detector
        # -race mới là trọng tâm của bước này. HTTP server, vòng lặp consumer
        # Kafka và cache JWKS đều chia sẻ trạng thái giữa các goroutine; một data
        # race ở đó hiện ra trong môi trường thật dưới dạng dữ liệu hỏng, chứ
        # không phải một test đỏ.
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: govulncheck
        # Quét những module THỰC SỰ gọi tới được từ code, chứ không quét cả cây
        # dependency — ít báo động giả hơn hẳn một bộ quét theo manifest.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    needs: [changes, test]
    if: needs.changes.outputs.services != '[]' && needs.changes.outputs.services != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    outputs:
      tag: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/Dockerfile
          # Chỉ đẩy image khi ở nhánh main. Bản build của PR vẫn biên dịch và vẫn
          # được quét, nên một Dockerfile hỏng sẽ fail ở khâu review chứ không
          # phải ở main.
          push: ${{ github.event_name == 'push' }}
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ steps.meta.outputs.short_sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/kalapa-${{ matrix.service }}:${{ steps.meta.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/kalapa-${{ matrix.service }}:latest
          # Cache của GitHub Actions; mode=max cache luôn cả các tầng trung gian,
          # nhờ vậy một tầng dependency không đổi sẽ không bao giờ phải build lại.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false

      - name: Scan the image
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/kalapa-${{ matrix.service }}:${{ steps.meta.outputs.short_sha }}
          format: table
          # Một image distroless tĩnh gần như không có gói hệ điều hành nào, nên
          # một phát hiện ở đây là CVE thật của dependency Go chứ không phải tiếng ồn.
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # Bước bàn giao sang GitOps.
  #
  # CI không deploy. Nó ghi tag bất biến mới vào values của chart rồi push; Argo
  # CD thấy commit đó và điều hoà lại cluster. Lợi ích ở đây không hề trừu tượng:
  #   - phiên bản đang chạy nhìn thấy được trong `git log`, có tác giả và có diff
  #   - rollback là `git revert`, không phải một câu lệnh kubectl phải nhớ
  #   - CI không giữ kubeconfig nào, nên một workflow bị chiếm quyền cũng không
  #     chạm trực tiếp được vào cluster
  # ---------------------------------------------------------------------------
  promote:
    needs: [changes, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin the new image tags
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.tag }}"
          changed=0
          for svc in $(echo '${{ needs.changes.outputs.services }}' | jq -r '.[]'); do
            f="deploy/charts/${svc}/values.yaml"
            [ -f "$f" ] || continue
            # Chỉ ghi lại đúng dòng `tag:` nằm dưới `image:`.
            yq -i ".\"go-service\".image.tag = \"${tag}\"" "$f"
            git add "$f"
            changed=1
            echo "  ${svc} -> ${tag}"
          done
          echo "changed=${changed}" >> "$GITHUB_ENV"

      - name: Commit and push
        if: env.changed == '1'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # [skip ci] ngăn commit này kích hoạt lại cả pipeline, nếu không nó sẽ
          # lặp vô tận.
          git commit -m "deploy: pin images to ${{ needs.build.outputs.tag }} [skip ci]"
          # Rebase phòng trường hợp có người push trong lúc bản build đang chạy.
          git pull --rebase origin main
          git push origin main
