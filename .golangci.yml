# Cấu hình golangci-lint. Cố ý viết ngắn: một file cấu hình linter không ai đọc
# nổi là một file ai cũng tắt đi.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose     # an unclosed response body leaks a connection per request
    - errcheck
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam

  settings:
    gosec:
      excludes:
        # G104 trùng với errcheck.
        - G104
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, bodyclose]

formatters:
  enable:
    - gofmt
