# Cấu hình của gitleaks.
#
# Mọi thông tin đăng nhập trong repo này đều là giá trị lab dùng xong bỏ. Chúng
# được commit một cách có chủ ý: một lab GitOps mà secret bị giấu đi thì chẳng
# dạy bạn được gì về cách secret chảy qua hệ thống. File này nói cho bộ quét
# biết cái nào là cố ý, để một thông tin đăng nhập BỊ LỘ THẬT vẫn làm fail build.
title = "kalapa-platform"

[extend]
useDefault = true

[allowlist]
description = "Các thông tin đăng nhập giả, dùng cho môi trường phát triển"
paths = [
  '''deploy/charts/kalapa-config/values\.yaml''',
  '''deploy/charts/postgres/values\.yaml''',
  '''deploy/charts/keycloak/values\.yaml''',
  '''deploy/argocd/bootstrap/argocd-values\.yaml''',
  '''docs/.*\.md''',
]
regexes = [
  '''kalapa-dev-password''',
  '''keycloak-dev-password''',
  '''gateway-dev-secret''',
  '''adminPassword: admin''',
]
